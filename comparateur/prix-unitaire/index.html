<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparateur de prix au kilo ou au litre — Simulateur</title><meta name="description" content="Comparez deux produits vendus dans des formats différents grâce au prix au kilo, au litre ou à l'unité."><link rel="canonical" href="https://simulateur.site/comparateur/prix-unitaire/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/comparateurs/">Comparateurs</a> → Prix unitaire</div><section class="tool"><div class="eyebrow">COMPARATEUR</div><h1>Comparer deux prix au kilo</h1><p class="tool-intro">Indiquez le prix et le poids de chaque produit. Simulateur ramène les deux offres à 1 kg.</p><div class="row"><div class="field"><label>Produit A — prix (€)</label><input id="pa" type="number" min="0" step=".01" placeholder="3.50"></div><div class="field"><label>Produit A — poids (g)</label><input id="qa" type="number" min="0" step="1" placeholder="500"></div><div class="field"><label>Produit B — prix (€)</label><input id="pb" type="number" min="0" step=".01" placeholder="5.20"></div><div class="field"><label>Produit B — poids (g)</label><input id="qb" type="number" min="0" step="1" placeholder="800"></div></div><button class="button-main" onclick="calc()">Comparer</button><div id="r" class="result" hidden></div></section></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){let A=+pa.value*1000/+qa.value,B=+pb.value*1000/+qb.value;r.hidden=false;if(!isFinite(A)||!isFinite(B)||A<0||B<0){r.innerHTML='Saisissez des valeurs valides.';return}r.innerHTML='<strong>A : '+A.toFixed(2)+' €/kg · B : '+B.toFixed(2)+' €/kg</strong><br>Écart : '+Math.abs(A-B).toFixed(2)+' €/kg.'}</script></body></html>
