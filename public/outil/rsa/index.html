:"Pré-estimez le RSA selon la composition du foyer, les ressources et le forfait logement.",fields:function(){return F.row([F.select("foyer","Composition du foyer",[["s0","Seul · 0 charge"],["c0","Couple · 0 charge"],["s1","Seul · 1 charge"],["c1","Couple · 1 charge"],["s2","Seul · 2 charges"],["c2","Couple · 2 charges"]]),F.text("ress","Ressources mensuelles moyennes du foyer (€)","0")])+F.select("log","Forfait logement applicable",[["0","0 €"],["s","78,20 € — 1 personne"],["d","156,41 € — 2 personnes"],["t","193,55 € — 3 personnes ou plus"]])},calc:function(){const v={s0:651.69,c0:977.54,s1:977.54,c1:1173.05,s2:1173.05,c2:1368.56}[this.$("foyer").value],l={0:0,s:78.20,d:156.41,t:193.55}[this.$("log").value],r=+this.$("ress").value||0,x=Math.max(0,v-r-l);return "<strong>"+this.euro(x)+" / mois</strong><br><br>Montant forfaitaire : "+this.euro(v)+"<br>Ressources déduites : "+this.euro(r)+"<br>Forfait logement : "+this.euro(l)+"<p class='small'>Pré-estimation : le RSA réel tient compte des ressources du foyer sur le trimestre de référence et de nombreuses prestations et situations particulières.</p>},source:"CAF : du 1er avril 2026 au 31 mars 2027, le forfait est de 651,69 € pour une personne seule sans charge, 977,54 € pour un couple sans charge, puis augmente selon les personnes à charge. Le forfait logement est de 78,20 €, 156,41 € ou 193,55 €. citeturn1search10"};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
