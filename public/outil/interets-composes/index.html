<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulateur intérêts composés 2026 | Simulateur</title><meta name="description" content="Projetez un capital avec versement initial, versements mensuels, rendement, frais et inflation."><link rel="canonical" href="https://simulateur.site/outil/interets-composes/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Simulateur intérêts composés 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="any" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"ÉPARGNE",title:"Simulateur intérêts composés 2026",intro:"Projetez un capital avec versement initial, versements mensuels, rendement, frais et inflation.",fields:function(){return F.row([F.text("initial","Capital initial (€)","10000"),F.text("mensuel","Versement mensuel (€)","300"),F.text("taux","Rendement annuel (%)","7"),F.text("duree","Durée (années)","20"),F.text("frais","Frais annuels (%)","0.2"),F.text("inflation","Inflation annuelle (%)","2")])},calc:function(){const c=+this.$('initial').value||0,v=+this.$('mensuel').value||0,r=(+this.$('taux').value||0)/100,f=(+this.$('frais').value||0)/100,inf=(+this.$('inflation').value||0)/100,n=Math.round((+this.$('duree').value||0)*12);if(c<0||v<0||n<=0)return 'Renseignez des valeurs valides.';const rm=Math.pow(1+Math.max(-.99,r-f),1/12)-1;let x=c;for(let i=0;i<n;i++)x=x*(1+rm)+v;const verse=c+v*n;return '<strong>'+this.euro(x)+'</strong> de capital final<br><br>Versements : '+this.euro(verse)+'<br>Gains : '+this.euro(x-verse)+'<br>Valeur en euros constants : '+this.euro(x/Math.pow(1+inf,n))+'<p class="small">Hypothèse de rendement constant ; aucune performance future n’est garantie.</p>'},source:"Formule de capitalisation mensuelle avec conversion du rendement annuel en taux mensuel équivalent ; frais soustraits du rendement hypothétique. Inflation utilisée uniquement pour une lecture en euros constants."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
