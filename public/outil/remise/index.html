<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de remise | Simulateur</title><meta name="description" content="Calculez le prix après remise."><link rel="canonical" href="https://simulateur.site/outil/remise/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">Calculateur de remise</div><h1 id="title">Calculateur de remise</h1><p id="intro">Calculez le prix après remise.</p><div id="fields"><div class="field"><label for="p">Prix initial (€)</label><input id="p" type="number" value="120"></div><div class="field"><label for="r">Remise (%)</label><input id="r" type="number" value="15"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Calculez le prix après remise.</p></div></div></div></main><script>window.TOOL={ey:"Calculateur de remise",title:"Calculateur de remise",intro:"Calculez le prix après remise.",fields:function(){},calc:function(){const p=+this.$("p").value,r=+this.$("r").value;if(p<0||r<0||r>100)return"Valeurs invalides.";return"<strong>"+this.euro(p*(1-r/100))+"</strong>"},source:"Calculez le prix après remise."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
