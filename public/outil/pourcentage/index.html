<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de pourcentage — part, évolution et différence | Simulateur</title><meta name="description" content="Calculez une part en pourcentage, une variation entre deux valeurs ou retrouvez quel pourcentage représente une valeur."><link rel="canonical" href="https://simulateur.site/outil/pourcentage/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Pourcentage</div><div class="tool"><h1>Calculateur de pourcentage</h1><p class="tool-intro">Trois calculs fréquents dans un seul outil.</p><div class="field"><label for="mode">Calcul</label><select id="mode" onchange="render()"><option value="part">Quel est X % de Y ?</option><option value="ratio">A représente quel pourcentage de B ?</option><option value="change">Quelle est l'évolution entre deux valeurs ?</option></select></div><div id="fields"></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">Saisissez vos valeurs.</div><div class="takeaway" id="insight" hidden></div><div class="formula"><strong>Formules</strong><p id="formula">X × Y ÷ 100</p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a></div></div></footer><script>const f=document.querySelector('#fields'),m=document.querySelector('#mode'),r=document.querySelector('#r'),formula=document.querySelector('#formula'),insight=document.querySelector('#insight');function render(){if(m.value==='part'){f.innerHTML='<div class="row"><div class="field"><label for="a">Pourcentage (%)</label><input id="a" type="number" step="any" placeholder="20"></div><div class="field"><label for="b">Valeur</label><input id="b" type="number" step="any" placeholder="150"></div></div>';formula.textContent='Pourcentage × valeur ÷ 100'}else if(m.value==='ratio'){f.innerHTML='<div class="row"><div class="field"><label for="a">Valeur A</label><input id="a" type="number" step="any" placeholder="30"></div><div class="field"><label for="b">Valeur B</label><input id="b" type="number" step="any" placeholder="120"></div></div>';formula.textContent='A ÷ B × 100'}else{f.innerHTML='<div class="row"><div class="field"><label for="a">Valeur de départ</label><input id="a" type="number" step="any" placeholder="100"></div><div class="field"><label for="b">Valeur d\u0027arrivée</label><input id="b" type="number" step="any" placeholder="125"></div></div>';formula.textContent='(arrivée − départ) ÷ départ × 100'}}function calc(){const a=Number(document.querySelector('#a').value),b=Number(document.querySelector('#b').value);if(!Number.isFinite(a)||!Number.isFinite(b)||(m.value!=='part'&&b===0)||(m.value==='change'&&a===0)){r.textContent='Saisissez des valeurs valides.';insight.hidden=true;return}let x;if(m.value==='part'){x=a*b/100;r.innerHTML='<strong>'+fmt(x)+'</strong>'}else if(m.value==='ratio'){x=a/b*100;r.innerHTML='<strong>'+fmt(x)+' %</strong>'}else{x=(b-a)/a*100;r.innerHTML='<strong>'+fmt(x)+' %</strong> · '+(x>=0?'hausse':'baisse')} }function fmt(x){return x.toLocaleString('fr-FR',{maximumFractionDigits:4})}render();</script></body></html>
