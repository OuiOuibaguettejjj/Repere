<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de pourcentage | Simulateur</title><meta name="description" content="Calculez rapidement un pourcentage d'une valeur."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Calculateur de pourcentage</h1><p id="intro">Calculez rapidement un pourcentage d'une valeur.</p><div id="fields"><div class="field"><label for="v">Valeur</label><input id="v" type="number" step="any" value="250"></div><div class="field"><label for="p">Pourcentage</label><input id="p" type="number" step="any" value="20"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez rapidement un pourcentage d'une valeur.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Calculateur de pourcentage",intro:"Calculez rapidement un pourcentage d'une valeur.",fields:function(){},calc:function(){const v=+this.$("v").value,p=+this.$("p").value;if(v<0||p<0)return"Valeurs invalides.";return"<strong>"+this.euro(v*p/100)+"</strong><br><br>"+p+" % de "+this.euro(v)},source:"Calculez rapidement un pourcentage d'une valeur.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
