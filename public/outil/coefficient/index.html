<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de coefficient | Simulateur</title><meta name="description" content="Calculez le coefficient multiplicateur et la variation entre deux valeurs."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Calculateur de coefficient</h1><p id="intro">Calculez le coefficient multiplicateur et la variation entre deux valeurs.</p><div id="fields"><div class="field"><label for="a">Valeur initiale</label><input id="a" type="number" step="any" value="100"></div><div class="field"><label for="b">Valeur finale</label><input id="b" type="number" step="any" value="125"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez le coefficient multiplicateur et la variation entre deux valeurs.. Calcul selon les formules mathématiques standard.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Calculateur de coefficient",intro:"Calculez le coefficient multiplicateur et la variation entre deux valeurs.",fields:function(){},calc:function(){const a=+this.$("a").value,b=+this.$("b").value;if(a===0||!Number.isFinite(a)||!Number.isFinite(b))return"Valeurs invalides.";return"<strong>Coefficient : "+(b/a).toFixed(4)+"</strong><br><br>Variation : "+((b/a-1)*100).toFixed(2)+" %"},source:"Calculez le coefficient multiplicateur et la variation entre deux valeurs.. Calcul selon les formules mathématiques standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
