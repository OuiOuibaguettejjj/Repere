<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertisseur de durée | Simulateur</title><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">TEMPS</div><h1 id="title">Convertisseur de durée</h1><p id="intro">Convertissez une durée en secondes, minutes et heures.</p><div id="fields"><div class="field"><label for="v">Valeur</label><input id="v" type="number" step="any" value="90"></div><div class="field"><label for="u">Unité</label><select id="u"><option value="s">secondes</option><option value="m">minutes</option><option value="h">heures</option></select></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Convertissez une durée en secondes, minutes et heures.</p></div></div></div></main><script>window.TOOL={ey:"TEMPS",title:"Convertisseur de durée",intro:"Convertissez une durée en secondes, minutes et heures.",fields:function(){},calc:function(){const v=+this.$("v").value,u=this.$("u").value;if(v<0)return"Valeur invalide.";const s=u==="s"?v:u==="m"?v*60:v*3600;return"<strong>"+s.toLocaleString("fr-FR")+" seconde(s)</strong><br><br>"+(s/60).toLocaleString("fr-FR")+" minute(s)<br>"+(s/3600).toLocaleString("fr-FR")+" heure(s)"},source:"Convertissez une durée en secondes, minutes et heures."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
