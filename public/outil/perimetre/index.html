<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de périmètre | Simulateur</title><meta name="description" content="Calculez le périmètre d'un rectangle, carré ou cercle."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">GÉOMÉTRIE</div><h1 id="title">Calculateur de périmètre</h1><p id="intro">Calculez le périmètre d'un rectangle, carré ou cercle.</p><div id="fields"><div class="field"><label for="shape">Figure</label><select id="shape"><option value="rect">Rectangle</option><option value="square">Carré</option><option value="circle">Cercle</option></select></div><div class="field"><label for="a">Longueur / côté</label><input id="a" type="number" step="any" value="5"></div><div class="field"><label for="b">Largeur</label><input id="b" type="number" step="any" value="3"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez le périmètre d'un rectangle, carré ou cercle.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"GÉOMÉTRIE",title:"Calculateur de périmètre",intro:"Calculez le périmètre d'un rectangle, carré ou cercle.",fields:function(){},calc:function(){const s=this.$("shape").value,a=+this.$("a").value,b=+this.$("b").value;if(a<=0||b<0)return"Valeurs invalides.";const p=s==="circle"?2*Math.PI*a:s==="square"?4*a:2*(a+b);return"<strong>"+p.toLocaleString("fr-FR",{maximumFractionDigits:4})+" unités</strong>"},source:"Calculez le périmètre d'un rectangle, carré ou cercle.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
