<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur plus-value mobilière 2026 | Simulateur</title><meta name="description" content="Calculez la plus-value sur une vente de valeurs mobilières et son PFU indicatif."><link rel="canonical" href="https://simulateur.site/outil/plus-value-mobiliere/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur plus-value mobilière 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="any" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"FISCALITÉ",title:"Calculateur plus-value mobilière 2026",intro:"Calculez la plus-value sur une vente de valeurs mobilières et son PFU indicatif.",fields:function(){return F.row([F.text("achat","Prix total d'achat (€)","10000"),F.text("vente","Prix total de vente (€)","15000"),F.text("frais","Frais liés à l'opération (€)","0")])},calc:function(){const a=+this.$('achat').value||0,v=+this.$('vente').value||0,f=Math.max(0,+this.$('frais').value||0);if(a<0||v<0)return 'Renseignez des montants valides.';const pv=Math.max(0,v-a-f);return '<strong>Plus-value : '+this.euro(pv)+'</strong><br><br>IR au PFU 12,8 % : '+this.euro(pv*.128)+'<br>Prélèvements sociaux 17,2 % : '+this.euro(pv*.172)+'<br><strong>PFU indicatif : '+this.euro(pv*.30)+'</strong><p class="small">Hors moins-values antérieures, régimes particuliers et option globale pour le barème progressif.</p>'},source:"Service-Public, revenus d’épargne et placement : PFU de 30 %, soit 12,8 % d’impôt sur le revenu + 17,2 % de prélèvements sociaux pour les revenus mobiliers concernés. L’option pour le barème est globale et peut modifier le résultat."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
