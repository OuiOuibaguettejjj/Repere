<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulateur frais de notaire 2026 | Simulateur</title><meta name="description" content="Estimez les frais d'acquisition d'un logement ancien ou neuf."><link rel="canonical" href="https://simulateur.site/outil/frais-de-notaire/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Simulateur frais de notaire 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="any" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"IMMOBILIER",title:"Simulateur frais de notaire 2026",intro:"Estimez les frais d'acquisition d'un logement ancien ou neuf.",fields:function(){return F.row([F.text("prix","Prix du bien (€)","250000"),F.text("type","Type","ancien,Logement ancien,neuf,Logement neuf")])},calc:function(){const p=+this.$('prix').value||0,t=this.$('type').value; if(p<=0)return 'Renseignez un prix valide.'; const d=t==='ancien'?p*.0632:p*.0071, e=p<=6500?p*.0387:6500*.0387+(p<=17000?(p-6500)*.01596:10500*.01596+(p<=60000?(p-17000)*.01064:43000*.01064+(p-60000)*.00799)),b=t==='ancien'?800:500,total=d+e+b; return '<strong>Frais estimés : '+this.euro(total)+'</strong><br><br>Droits et taxes : '+this.euro(d)+'<br>Émoluments : '+this.euro(e)+'<br>Débours provisionnés : '+this.euro(b)+'<p class="small">Estimation nationale simplifiée : le département, l\'opération et les frais annexes peuvent modifier le montant.</p>'},source:"Service-Public, fiche « Frais de notaire » vérifiée le 5 août 2026 ; impots.gouv.fr, fiche mise à jour le 17 juillet 2026. Le taux global maximal indiqué pour les droits de mutation de l’ancien est de 6,32 % sur la période 2025-2028 ; le neuf bénéficie d’un taux réduit. Le montant exact dépend du département et de l’acte."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
