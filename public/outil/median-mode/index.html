<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur médiane et mode | Simulateur</title><meta name="description" content="Calculez la médiane et le mode d'une série de nombres."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">STATISTIQUES</div><h1 id="title">Calculateur médiane et mode</h1><p id="intro">Calculez la médiane et le mode d'une série de nombres.</p><div id="fields"><div class="field"><label for="s">Série de nombres</label><input id="s" value="12, 15, 15, 18, 20"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez la médiane et le mode d'une série de nombres.. Calcul selon les formules mathématiques standard.</p></div></div></div></main><script>window.TOOL={ey:"STATISTIQUES",title:"Calculateur médiane et mode",intro:"Calculez la médiane et le mode d'une série de nombres.",fields:function(){},calc:function(){const a=this.$("s").value.split(/[,;\s]+/).map(Number).filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return"Saisissez une série.";const med=a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2,c={};a.forEach(x=>c[x]=(c[x]||0)+1);const mx=Math.max(...Object.values(c));const modes=Object.keys(c).filter(x=>c[x]===mx&&mx>1);return"<strong>Médiane : "+med+"</strong><br><br>Mode : "+(modes.length?modes.join(", "):"aucun")},source:"Calculez la médiane et le mode d'une série de nombres.. Calcul selon les formules mathématiques standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
