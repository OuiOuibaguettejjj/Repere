<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de médiane et mode — Simulateur</title><meta name="description" content="Calculez la médiane, la moyenne et le mode d'une série de nombres."><link rel="canonical" href="https://simulateur.site/outil/median-mode/"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><section class="tool"><div class="eyebrow">STATISTIQUES</div><h1>Médiane, moyenne et mode</h1><p class="tool-intro">Saisissez une série de nombres séparés par des virgules, espaces ou points-virgules.</p><div class="field"><label for="v">Valeurs</label><input id="v" placeholder="12, 15, 15, 18, 20"></div><button class="button-main" id="go">Calculer</button><div class="result" id="r" aria-live="polite">—</div></section></div><section class="related-tools"><div><div class="eyebrow">STATISTIQUES</div><h2>Outils associés</h2></div><div class="related-links"><a class="related-link" href="/outil/moyenne/">Moyenne →</a><a class="related-link" href="/outil/moyenne-ponderee/">Moyenne pondérée →</a><a class="related-link" href="/outil/ratio/">Ratio →</a><a class="related-link" href="/outil/proportion/">Proportion →</a></div></section></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>const v=document.querySelector('#v'),r=document.querySelector('#r');document.querySelector('#go').onclick=()=>{const a=v.value.split(/[;,\s]+/).filter(Boolean).map(Number);if(!a.length||a.some(x=>!Number.isFinite(x))){r.textContent='Saisissez uniquement des nombres.';return}a.sort((x,y)=>x-y);const n=a.length,m=n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;const c={};a.forEach(x=>c[x]=(c[x]||0)+1);const max=Math.max(...Object.values(c));const modes=max>1?Object.keys(c).filter(x=>c[x]===max).map(Number):[];r.innerHTML='<strong>Médiane : '+m.toLocaleString('fr-FR')+'</strong><br>Moyenne : '+(a.reduce((s,x)=>s+x,0)/n).toLocaleString('fr-FR',{maximumFractionDigits:6})+'<br>Mode : '+(modes.length?modes.map(x=>x.toLocaleString('fr-FR')).join(', '):'aucun mode')+'<br>Nombre de valeurs : '+n}</script></body></html>
