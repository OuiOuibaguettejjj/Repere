mez un revenu après cotisations.",fields:function(){return F.row([F.text("revenu","Revenu professionnel (€)","50000"),F.text("taux","Taux de cotisations (%)","45")])},calc:function(){let r=Number(this.$("revenu").value),c=r*Number(this.$("taux").value)/100;return"<strong>"+this.euro(r-c)+"</strong> après cotisations estimées<br>Cotisations : "+this.euro(c)},source:"Urssaf Mon-entreprise. Taux paramétrable pour éviter une fausse précision."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script><script src="/enter-calcul.js" defer></script></body></html>
