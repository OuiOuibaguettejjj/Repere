<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de rendement locatif | Simulateur</title><meta name="description" content="Calculez rendement brut et rendement net simplifié."><link rel="canonical" href="https://simulateur.site/outil/rendement-locatif/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur de rendement locatif</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title">Calculateur de rendement locatif</h1><p class="tool-intro" id="intro">Calculez rendement brut et rendement net simplifié.</p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos valeurs puis lancez le calcul.</div><div class="formula"><strong>Source et périmètre</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"IMMOBILIER",title:"Calculateur de rendement locatif",intro:"Calculez rendement brut et rendement net simplifié.",fields:function(){return F.row([F.text("prix","Prix d’acquisition (€)","200000"),F.text("loyer","Loyer mensuel (€)","900")])+F.row([F.text("charges","Charges annuelles (€)","1800"),F.text("taxe","Taxe foncière annuelle (€)","1200")])},calc:function(){let p=Number(this.$("prix")?.value||0),l=Number(this.$("loyer")?.value||0),x=Number(this.$("charges")?.value||0),t=Number(this.$("taxe")?.value||0);const gross=l*12/p*100, net=(l*12-x-t)/p*100; return`<div class="result-main"><strong>"+this.num(gross)+" %</strong> brut</div><div class="takeaway"><div class="takeaway-title">À retenir</div><div class="takeaway-grid"><div class="takeaway-item"><small>Rendement brut</small><strong>"+this.num(gross)+" %</strong></div><div class="takeaway-item"><small>Rendement net simplifié</small><strong>"+this.num(net)+" %</strong></div><div class="takeaway-item"><small>Revenu locatif annuel</small><strong>"+this.euro(l*12)+"</strong></div></div></div><div class="scenario"><div class="scenario-title">Et si…</div><div class="scenario-grid"><div class="scenario-item"><small>Loyer +50 € / mois</small><strong>"+this.num(gross+600/p)+" % brut</strong></div><div class="scenario-item"><small>Prix -10 %</small><strong>"+this.num(gross/0.9)+" % brut</strong></div></div></div>`},source:"Calcul de rendement. Fiscalité, vacance, travaux, financement et frais d’acquisition exclus."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
