<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur d’épargne mensuelle | Simulateur</title><meta name="description" content="Projetez un capital avec versements réguliers."><link rel="canonical" href="https://simulateur.site/outil/epargne-mensuelle/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur d’épargne mensuelle</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title">Calculateur d’épargne mensuelle</h1><p class="tool-intro" id="intro">Projetez un capital avec versements réguliers.</p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos valeurs puis lancez le calcul.</div><div class="formula"><strong>Source et périmètre</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"ÉPARGNE",title:"Calculateur d’épargne mensuelle",intro:"Projetez un capital avec versements réguliers.",fields:function(){return F.row([F.text("initial","Capital initial (€)","5000"),F.text("mensuel","Versement mensuel (€)","300")])+F.row([F.text("rend","Rendement annuel (%)","5"),F.text("ans","Durée (années)","10")])},calc:function(){let c=Number(this.$("initial").value),m=Number(this.$("mensuel").value),r=Number(this.$("rend").value)/1200,N=Number(this.$("ans").value)*12,f=Math.pow(1+r,N),x=c*f+m*((f-1)/r||N);return"<strong>"+this.euro(x)+"</strong> de capital final<br>Gains théoriques : "+this.euro(x-c-m*N)},source:"Projection mathématique hors fiscalité, frais et variation des rendements."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script><script src="/enter-calcul.js" defer></script></body></html>
