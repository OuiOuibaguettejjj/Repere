<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulateur épargne mensuelle 2026 | Simulateur</title><meta name="description" content="Projetez votre capital avec une épargne initiale et des versements mensuels."><link rel="canonical" href="https://simulateur.site/outil/epargne-mensuelle/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Simulateur épargne mensuelle 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="any" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"ÉPARGNE",title:"Simulateur épargne mensuelle 2026",intro:"Projetez votre capital avec une épargne initiale et des versements mensuels.",fields:function(){return F.row([F.text("initial","Épargne initiale (€)","5000"),F.text("mensuel","Versement mensuel (€)","300"),F.text("taux","Rendement annuel (%)","3"),F.text("annees","Durée (années)","10")])},calc:function(){const c=+this.$('initial').value||0,v=+this.$('mensuel').value||0,r=(+this.$('taux').value||0)/100,n=Math.round((+this.$('annees').value||0)*12);if(c<0||v<0||n<=0)return 'Renseignez des valeurs valides.';const rm=Math.pow(1+r,1/12)-1,x=c*Math.pow(1+rm,n)+(rm?v*(Math.pow(1+rm,n)-1)/rm:v*n);return '<strong>'+this.euro(x)+'</strong> après '+(n/12)+' an(s)<br><br>Capital versé : '+this.euro(c+v*n)+'<br>Intérêts estimés : '+this.euro(x-c-v*n)+'<p class="small">Rendement constant hypothétique, hors fiscalité et frais.</p>'},source:"Formule de valeur future d’un capital initial et de versements mensuels réguliers avec capitalisation mensuelle équivalente au taux annuel saisi."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
