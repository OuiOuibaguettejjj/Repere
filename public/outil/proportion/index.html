<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de proportion | Simulateur</title><meta name="description" content="Résolvez une proportion A/B = C/X."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Calculateur de proportion</h1><p id="intro">Résolvez une proportion A/B = C/X.</p><div id="fields"><div class="field"><label for="a">A</label><input id="a" type="number" step="any" value="2"></div><div class="field"><label for="b">B</label><input id="b" type="number" step="any" value="3"></div><div class="field"><label for="c">C</label><input id="c" type="number" step="any" value="10"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Résolvez une proportion A/B = C/X.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Calculateur de proportion",intro:"Résolvez une proportion A/B = C/X.",fields:function(){},calc:function(){const a=+this.$("a").value,b=+this.$("b").value,c=+this.$("c").value;if(a===0||!Number.isFinite(a)||!Number.isFinite(b)||!Number.isFinite(c))return"Valeurs invalides.";return"<strong>X = "+(b*c/a).toLocaleString("fr-FR")+"</strong>"},source:"Résolvez une proportion A/B = C/X.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
