<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de vitesse | Simulateur</title><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">PHYSIQUE</div><h1 id="title">Calculateur de vitesse</h1><p id="intro">Calculez une vitesse à partir d'une distance et d'une durée.</p><div id="fields"><div class="field"><label for="d">Distance (km)</label><input id="d" type="number" step="any" value="100"></div><div class="field"><label for="t">Durée (heures)</label><input id="t" type="number" step="any" value="2"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Calculez une vitesse à partir d'une distance et d'une durée.</p></div></div></div></main><script>window.TOOL={ey:"PHYSIQUE",title:"Calculateur de vitesse",intro:"Calculez une vitesse à partir d'une distance et d'une durée.",fields:function(){},calc:function(){const d=+this.$("d").value,t=+this.$("t").value;if(d<0||t<=0)return"Valeurs invalides.";const v=d/t;return"<strong>"+v.toLocaleString("fr-FR",{maximumFractionDigits:2})+" km/h</strong><br><br>"+(v/3.6).toLocaleString("fr-FR",{maximumFractionDigits:2})+" m/s"},source:"Calculez une vitesse à partir d'une distance et d'une durée."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
