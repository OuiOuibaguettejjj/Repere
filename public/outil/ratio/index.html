<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de ratio | Simulateur</title><meta name="description" content="Calculez un ratio et sa forme simplifiée."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Calculateur de ratio</h1><p id="intro">Calculez un ratio et sa forme simplifiée.</p><div id="fields"><div class="field"><label for="a">Valeur A</label><input id="a" type="number" step="any" value="12"></div><div class="field"><label for="b">Valeur B</label><input id="b" type="number" step="any" value="18"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez un ratio et sa forme simplifiée.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Calculateur de ratio",intro:"Calculez un ratio et sa forme simplifiée.",fields:function(){},calc:function(){const a=+this.$("a").value,b=+this.$("b").value;if(a<0||b<0||a===0||b===0)return"Valeurs invalides.";const g=(x,y)=>y?g(y,x%y):x;const d=g(a,b);return"<strong>"+(a/b).toFixed(4)+"</strong><br><br>Ratio simplifié : "+a/d+" : "+b/d},source:"Calculez un ratio et sa forme simplifiée.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
