<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SASU, EI ou micro : comparateur | Simulateur</title><meta name="description" content="Comparez trois cadres d'activité sur des hypothèses simples."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">ENTREPRENEURIAT</div><h1 id="title">SASU, EI ou micro : comparateur</h1><p id="intro">Comparez trois cadres d'activité sur des hypothèses simples.</p><div id="fields"><div class="field"><label for="ca">Chiffre d'affaires (€)</label><input id="ca" type="number" step="any" value="50000"></div><div class="field"><label for="dep">Dépenses (€)</label><input id="dep" type="number" step="any" value="10000"></div><div class="field"><label for="s">Structure</label><select id="s"><option>Micro</option><option>EI</option><option>SASU</option></select></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Simulation pédagogique : les cotisations, l'impôt et les frais réels dépendent de l'activité et du statut. Elle ne remplace pas un calcul fiscal ou social personnalisé.</p></div></div></div></main><script>window.TOOL={ey:"ENTREPRENEURIAT",title:"SASU, EI ou micro : comparateur",intro:"Comparez trois cadres d'activité sur des hypothèses simples.",fields:function(){},calc:function(){const ca=+this.$("ca").value,d=+this.$("dep").value,s=this.$("s").value;if(ca<0||d<0)return"Valeurs invalides.";const rate=s==="Micro"?0.256:s==="EI"?0.30:0.45,base=s==="Micro"?ca:Math.max(0,ca-d),c=base*rate;return"<strong>Base après charges estimées : "+this.euro(Math.max(0,base-c))+"</strong><br><br>Charges théoriques : "+this.euro(c)},source:"Simulation pédagogique : les cotisations, l'impôt et les frais réels dépendent de l'activité et du statut. Elle ne remplace pas un calcul fiscal ou social personnalisé."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
