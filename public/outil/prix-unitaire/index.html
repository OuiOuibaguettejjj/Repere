<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de prix unitaire | Simulateur</title><meta name="description" content="Calculez le prix au kilo, au litre ou à l'unité pour comparer des produits."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">ACHATS</div><h1 id="title">Calculateur de prix unitaire</h1><p id="intro">Calculez le prix au kilo, au litre ou à l'unité pour comparer des produits.</p><div id="fields"><div class="field"><label for="p">Prix (€)</label><input id="p" type="number" step="any" value="10"></div><div class="field"><label for="q">Quantité</label><input id="q" type="number" step="any" value="2"></div><div class="field"><label for="u">Unité</label><select id="u"><option>kg</option><option>L</option><option>unité</option></select></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez le prix au kilo, au litre ou à l'unité pour comparer des produits.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"ACHATS",title:"Calculateur de prix unitaire",intro:"Calculez le prix au kilo, au litre ou à l'unité pour comparer des produits.",fields:function(){},calc:function(){const p=+this.$("p").value,q=+this.$("q").value,u=this.$("u").value;if(p<0||q<=0)return"Valeurs invalides.";return"<strong>"+this.euro(p/q)+" / "+u+"</strong>"},source:"Calculez le prix au kilo, au litre ou à l'unité pour comparer des produits.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
