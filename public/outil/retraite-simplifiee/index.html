ETRAITE",title:"Simulateur retraite simplifié 2026",intro:"Estimez la retraite de base d'un salarié du privé à partir du salaire moyen et des trimestres.",fields:function(){return F.row([F.text("sam","Salaire annuel moyen 25 meilleures années (€)","30000"),F.text("tr","Trimestres validés","170"),F.text("req","Trimestres requis","170"),F.text("age","Âge de départ","64")])},calc:function(){const s=+this.$('sam').value||0,tr=Math.max(0,+this.$('tr').value||0),req=Math.max(1,+this.$('req').value||0),age=+this.$('age').value||0;if(s<=0||age<=0)return 'Renseignez des valeurs valides.';const miss=Math.max(0,Math.min(20,Math.ceil(Math.min(req-tr,Math.max(0,67-age)*4)))),rate=age>=67?50:Math.max(37.5,50-miss*.625),p=s*rate/100*Math.min(tr/req,1);return '<strong>'+this.euro(p)+' brut/an</strong><br>≈ '+this.euro(p/12)+' brut/mois<br><br>Taux de liquidation : '+rate.toFixed(3)+' %<br>Ratio de trimestres : '+Math.min(tr,req)+' / '+req+'<p class="small">Retraite de base uniquement. Agirc-Arrco, majorations et dispositifs de départ anticipé ne sont pas intégrés.</p>'},source:"Service-Public : retraite de base = salaire annuel moyen des 25 meilleures années × taux × trimestres validés/ durée requise. Le taux maximal est 50 % ; avant 67 ans, la décote est de 0,625 point par trimestre manquant, avec un maximum de 20 trimestres."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
