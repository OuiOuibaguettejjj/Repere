<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de cash-flow immobilier | Simulateur</title><meta name="description" content="Estimez le cash-flow mensuel avant impôt."><link rel="canonical" href="https://simulateur.site/outil/cash-flow-immobilier/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur de cash-flow immobilier</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title">Calculateur de cash-flow immobilier</h1><p class="tool-intro" id="intro">Estimez le cash-flow mensuel avant impôt.</p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos valeurs puis lancez le calcul.</div><div class="formula"><strong>Source et périmètre</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"IMMOBILIER",title:"Calculateur de cash-flow immobilier",intro:"Estimez le cash-flow mensuel avant impôt.",fields:function(){return F.row([F.text("loyer","Loyer mensuel (€)","1000"),F.text("charges","Charges mensuelles (€)","180")])+F.row([F.text("credit","Mensualité (€)","750"),F.text("taxe","Taxe foncière mensuelle (€)","100")])},calc:function(){let x=Number(this.$("loyer")?.value||0)-Number(this.$("charges")?.value||0)-Number(this.$("credit")?.value||0)-Number(this.$("taxe")?.value||0);return"<strong>"+this.euro(x)+"</strong> / mois<br>"+this.euro(x*12)+" / an"},source:"Calcul simplifié : impôt, assurance, vacance, travaux et frais exceptionnels exclus."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script><script src="/enter-calcul.js" defer></script></body></html>
