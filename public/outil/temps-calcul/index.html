<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de durée | Simulateur</title><meta name="description" content="Additionnez heures, minutes et secondes."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">TEMPS</div><h1 id="title">Calculateur de durée</h1><p id="intro">Additionnez heures, minutes et secondes.</p><div id="fields"><div class="field"><label for="h">Heures</label><input id="h" type="number" step="any" value="2"></div><div class="field"><label for="m">Minutes</label><input id="m" type="number" step="any" value="30"></div><div class="field"><label for="s">Secondes</label><input id="s" type="number" step="any" value="0"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Conversion 1 h = 60 min = 3 600 s.</p></div></div></div></main><script>window.TOOL={ey:"TEMPS",title:"Calculateur de durée",intro:"Additionnez heures, minutes et secondes.",fields:function(){},calc:function(){const h=+this.$("h").value,m=+this.$("m").value,s=+this.$("s").value;if(h<0||m<0||s<0)return"Valeurs invalides.";const z=h*3600+m*60+s;return"<strong>"+(z/3600).toFixed(2)+" heure(s)</strong><br><br>"+z+" seconde(s)"},source:"Conversion 1 h = 60 min = 3 600 s."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
