<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur temps de travail | Simulateur</title><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">TRAVAIL</div><h1 id="title">Calculateur temps de travail</h1><p id="intro">Calculez les heures travaillées par semaine.</p><div id="fields"><div class="field"><label for="j">Jours par semaine</label><input id="j" type="number" step="any" value="5"></div><div class="field"><label for="h">Heures par jour</label><input id="h" type="number" step="any" value="7"></div><div class="field"><label for="p">Pause par jour</label><input id="p" type="number" step="any" value="1"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Calculez les heures travaillées par semaine.</p></div></div></div></main><script>window.TOOL={ey:"TRAVAIL",title:"Calculateur temps de travail",intro:"Calculez les heures travaillées par semaine.",fields:function(){},calc:function(){const j=+this.$("j").value,h=+this.$("h").value,p=+this.$("p").value;if(j<0||h<0||p<0||p>h)return"Valeurs invalides.";return"<strong>"+((h-p)*j).toFixed(2)+" heures / semaine</strong>"},source:"Calculez les heures travaillées par semaine."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
