<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulateur salaire brut net 2026 | Simulateur</title><meta name="description" content="Estimez le salaire net avant impôt à partir du brut mensuel, avec distinction cadre et non-cadre."><link rel="canonical" href="https://simulateur.site/outil/salaire-brut-net/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Simulateur salaire brut net</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title">Simulateur salaire brut net</h1><p class="tool-intro" id="intro">Estimez le net avant impôt à partir du salaire brut.</p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos valeurs puis lancez le calcul.</div><div class="formula"><strong>Source et périmètre</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"EMPLOI",title:"Simulateur salaire brut net",intro:"Estimez le net avant impôt à partir du salaire brut.",fields:function(){return F.row([F.text("brut","Salaire brut mensuel (€)","3500"),F.select("statut","Statut",[["noncadre","Non-cadre"],["cadre","Cadre"]])])},calc:function(){const b=Number(this.$("brut")?.value||0),s=this.$("statut")?.value;if(b<=0)return"Veuillez renseigner un salaire positif.";const taux=s==="cadre"?.25:.23,net=b*(1-taux);return"<strong>"+this.euro(net)+" / mois net estimé avant impôt</strong><br><small>Brut : "+this.euro(b)+" · cotisations salariales estimées : "+this.euro(b*taux)+" · annuel net estimé : "+this.euro(net*12)+"</small>"},source:"Urssaf Mon-entreprise précise que le net dépend des cotisations et de nombreux paramètres. Cette version est une estimation simplifiée avec 23 % non-cadre / 25 % cadre ; elle ne remplace pas le simulateur Urssaf ni le bulletin de paie."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script><script src="/enter-calcul.js" defer></script></body></html>
