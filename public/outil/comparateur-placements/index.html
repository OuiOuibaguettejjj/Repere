<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparateur de placements | Simulateur</title><meta name="description" content="Comparez deux placements selon rendement et frais."><link rel="canonical" href="https://simulateur.site/outil/comparateur-placements/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Comparateur de placements</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title">Comparateur de placements</h1><p class="tool-intro" id="intro">Comparez deux placements selon rendement et frais.</p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos valeurs puis lancez le calcul.</div><div class="formula"><strong>Source et périmètre</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"COMPARATEUR",title:"Comparateur de placements",intro:"Comparez deux placements selon rendement et frais.",fields:function(){return F.row([F.text("capital","Capital (€)","10000"),F.text("ans","Durée (années)","10")])+F.row([F.text("r1","Rendement A (%)","5"),F.text("f1","Frais A (%)","0.2")])+F.row([F.text("r2","Rendement B (%)","4"),F.text("f2","Frais B (%)","0")])},calc:function(){let c=Number(this.$("capital").value),a=Number(this.$("ans").value),x=c*Math.pow(1+(Number(this.$("r1").value)-Number(this.$("f1").value))/100,a),y=c*Math.pow(1+(Number(this.$("r2").value)-Number(this.$("f2").value))/100,a);return"<strong>A : "+this.euro(x)+"</strong><br>B : "+this.euro(y)+"<br>Écart théorique : "+this.euro(Math.abs(x-y))},source:"Comparaison mathématique hors fiscalité et risque."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script><script src="/enter-calcul.js" defer></script></body></html>
