<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparateur de placements 2026 | Simulateur</title><meta name="description" content="Comparez deux placements selon rendement, frais, durée et fiscalité simplifiée."><link rel="canonical" href="https://simulateur.site/outil/comparateur-placements/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Comparateur de placements 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"ÉPARGNE",title:"Comparateur de placements 2026",intro:"Comparez deux placements selon rendement, frais, durée et fiscalité simplifiée.",fields:function(){return F.row([F.text("a","Capital placement A (€)","10000"),F.text("b","Capital placement B (€)","10000")])+F.row([F.text("ra","Rendement A (%)","3"),F.text("rb","Rendement B (%)","5")])+F.row([F.text("fa","Frais annuels A (%)","0.2"),F.text("fb","Frais annuels B (%)","0.5")])+F.text("n","Durée (années)","10")},calc:function(){const a=+this.$("a").value||0,b=+this.$("b").value||0,ra=(+this.$("ra").value||0)/100-(+this.$("fa").value||0)/100,rb=(+this.$("rb").value||0)/100-(+this.$("fb").value||0)/100,n=+this.$("n").value||0;if(a<0||b<0||n<0)return "Renseignez des valeurs valides.";const A=a*Math.pow(1+ra,n),B=b*Math.pow(1+rb,n),ec=A>B?"A":"B";return "<strong>Placement "+ec+" donne le capital final le plus élevé selon vos hypothèses.</strong><br><br>A : "+this.euro(A)+"<br>B : "+this.euro(B)+"<p class='small'>Comparaison mathématique hors fiscalité, versements supplémentaires et risque. Un rendement historique n'est pas une garantie de rendement futur.</p>"},source:"Méthode : capitalisation composée du rendement annuel net des frais saisis. Les performances et la fiscalité réelles dépendent du produit et du cadre fiscal."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
