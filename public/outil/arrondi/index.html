<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur d'arrondi — Simulateur</title><meta name="description" content="Arrondissez un nombre à l'entier, au dixième, au centième ou au nombre de décimales de votre choix."><link rel="canonical" href="https://simulateur.site/outil/arrondi/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Arrondi</div><section class="tool"><div class="eyebrow">MATHS</div><h1>Calculateur d'arrondi</h1><p class="tool-intro">Arrondissez rapidement un nombre au niveau de précision souhaité.</p><div class="field"><label for="n">Nombre</label><input id="n" type="number" step="any" placeholder="12,3456"></div><div class="field"><label for="d">Décimales</label><input id="d" type="number" min="0" max="20" step="1" value="2"></div><button class="button-main" id="go">Arrondir</button><div class="result" id="r" aria-live="polite">—</div><div class="formula"><strong>Principe</strong><p>L'arrondi utilise la règle mathématique usuelle à la précision choisie.</p></div></section></div></main><footer><div class="wrap"><a href="/">Accueil</a> · <a href="/mentions-legales/">Mentions légales</a></div></footer><script>const n=document.querySelector('#n'),d=document.querySelector('#d'),r=document.querySelector('#r');document.querySelector('#go').onclick=()=>{const x=Number(n.value),p=Number(d.value);if(!Number.isFinite(x)||!Number.isInteger(p)||p<0||p>20){r.textContent='Saisissez un nombre et un nombre de décimales valide.';return}r.innerHTML='<strong>'+x.toLocaleString('fr-FR',{minimumFractionDigits:p,maximumFractionDigits:p})+'</strong>'}</script><script src="/enter-calcul.js" defer></script></body></html>
