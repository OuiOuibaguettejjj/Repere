<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur d'épargne | Simulateur</title><meta name="description" content="Projetez un capital futur avec versements mensuels et rendement annuel."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">ÉPARGNE</div><h1 id="title">Calculateur d'épargne</h1><p id="intro">Projetez un capital futur avec versements mensuels et rendement annuel.</p><div id="fields"><div class="field"><label for="c">Capital initial (€)</label><input id="c" type="number" step="any" value="10000"></div><div class="field"><label for="m">Versement mensuel (€)</label><input id="m" type="number" step="any" value="300"></div><div class="field"><label for="r">Rendement annuel (%)</label><input id="r" type="number" step="any" value="4"></div><div class="field"><label for="y">Durée (années)</label><input id="y" type="number" step="any" value="10"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Projetez un capital futur avec versements mensuels et rendement annuel.. Calcul selon les formules mathématiques standard.</p></div></div></div></main><script>window.TOOL={ey:"ÉPARGNE",title:"Calculateur d'épargne",intro:"Projetez un capital futur avec versements mensuels et rendement annuel.",fields:function(){},calc:function(){const c=+this.$("c").value,m=+this.$("m").value,r=(+this.$("r").value||0)/1200,n=Math.round((+this.$("y").value||0)*12);if(c<0||m<0||n<0||r<=-1)return"Valeurs invalides.";const f=c*Math.pow(1+r,n)+m*(r?((Math.pow(1+r,n)-1)/r):n);return"<strong>"+this.euro(f)+"</strong><br><br>Capital versé : "+this.euro(c+m*n)+"<br>Gains théoriques : "+this.euro(f-c-m*n)},source:"Projetez un capital futur avec versements mensuels et rendement annuel.. Calcul selon les formules mathématiques standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
