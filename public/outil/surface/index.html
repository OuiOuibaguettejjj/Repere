<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de surface | Simulateur</title><meta name="description" content="Calculez la surface d'un rectangle, carré ou cercle."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">GÉOMÉTRIE</div><h1 id="title">Calculateur de surface</h1><p id="intro">Calculez la surface d'un rectangle, carré ou cercle.</p><div id="fields"><div class="field"><label for="a">Longueur / côté / rayon</label><input id="a" type="number" step="any" value="5"></div><div class="field"><label for="b">Largeur</label><input id="b" type="number" step="any" value="3"></div><div class="field"><label for="s">Figure</label><select id="s"><option>Rectangle</option><option>Carré</option><option>Cercle</option></select></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Formules géométriques usuelles.</p></div></div></div></main><script>window.TOOL={ey:"GÉOMÉTRIE",title:"Calculateur de surface",intro:"Calculez la surface d'un rectangle, carré ou cercle.",fields:function(){},calc:function(){const a=+this.$("a").value,b=+this.$("b").value,s=this.$("s").value;if(a<=0||b<0)return"Valeurs invalides.";const x=s==="Cercle"?Math.PI*a*a:s==="Carré"?a*a:a*b;return"<strong>"+x.toLocaleString("fr-FR",{maximumFractionDigits:4})+" unités²</strong>"},source:"Formules géométriques usuelles."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
