<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de fractions — Simulateur</title><meta name="description" content="Additionnez, soustrayez, multipliez ou divisez deux fractions et obtenez une fraction simplifiée."><link rel="canonical" href="https://simulateur.site/outil/fractions/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Fractions</div><div class="tool"><h1>Calculateur de fractions</h1><p class="tool-intro">Effectuez les quatre opérations sur deux fractions et simplifiez le résultat.</p><div class="row"><div class="field"><label for="a">Numérateur A</label><input id="a" type="number" step="1" placeholder="1"></div><div class="field"><label for="b">Dénominateur A</label><input id="b" type="number" step="1" placeholder="2"></div></div><div class="field"><label for="op">Opération</label><select id="op"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select></div><div class="row"><div class="field"><label for="c">Numérateur B</label><input id="c" type="number" step="1" placeholder="1"></div><div class="field"><label for="d">Dénominateur B</label><input id="d" type="number" step="1" placeholder="4"></div></div><button class="button-main" id="calc">Calculer</button><div class="result" id="r">—</div><div class="formula"><strong>Résultat</strong><p>La fraction obtenue est automatiquement réduite à sa forme irréductible.</p></div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>const els=Object.fromEntries(['a','b','c','d'].map(x=>[x,document.querySelector('#'+x)])),op=document.querySelector('#op'),r=document.querySelector('#r');const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1};document.querySelector('#calc').addEventListener('click',()=>{const A=Number(els.a.value),B=Number(els.b.value),C=Number(els.c.value),D=Number(els.d.value);if(![A,B,C,D].every(Number.isInteger)||B===0||D===0||(op.value==='/'&&C===0)){r.textContent='Saisissez des entiers valides et des dénominateurs non nuls.';return}let n,q;if(op.value==='+'){n=A*D+C*B;q=B*D}else if(op.value==='-'){n=A*D-C*B;q=B*D}else if(op.value==='*'){n=A*C;q=B*D}else{n=A*D;q=B*C}if(q<0){n=-n;q=-q}const g=gcd(n,q);n/=g;q/=g;r.innerHTML='<strong>'+n+(q===1?'':' / '+q)+'</strong><br>≈ '+(n/q).toLocaleString('fr-FR',{maximumFractionDigits:8})})</script><script src="/enter-calcul.js" defer></script></body></html>
