<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de fractions | Simulateur</title><meta name="description" content="Additionnez, soustrayez, multipliez ou divisez deux fractions."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Calculateur de fractions</h1><p id="intro">Additionnez, soustrayez, multipliez ou divisez deux fractions.</p><div id="fields"><div class="field"><label for="an">Numérateur A</label><input id="an" type="number" step="any" value="1"></div><div class="field"><label for="ad">Dénominateur A</label><input id="ad" type="number" step="any" value="2"></div><div class="field"><label for="bn">Numérateur B</label><input id="bn" type="number" step="any" value="1"></div><div class="field"><label for="bd">Dénominateur B</label><input id="bd" type="number" step="any" value="3"></div><div class="field"><label for="op">Opération</label><select id="op"><option>+</option><option>-</option><option>×</option><option>÷</option></select></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Additionnez, soustrayez, multipliez ou divisez deux fractions.. Calcul selon les formules mathématiques standard.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Calculateur de fractions",intro:"Additionnez, soustrayez, multipliez ou divisez deux fractions.",fields:function(){},calc:function(){const a=+this.$("an").value,b=+this.$("ad").value,c=+this.$("bn").value,d=+this.$("bd").value,o=this.$("op").value;if(b===0||d===0||(o==="÷"&&c===0))return"Fraction invalide.";let n=o==="+"?a*d+c*b:o==="-"?a*d-c*b:o==="×"?a*c:a*d,den=o==="+"||o==="-"?b*d:o==="×"?b*d:b*c;return"<strong>"+n+"/"+den+"</strong> ≈ "+(n/den).toLocaleString("fr-FR")},source:"Additionnez, soustrayez, multipliez ou divisez deux fractions.. Calcul selon les formules mathématiques standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
