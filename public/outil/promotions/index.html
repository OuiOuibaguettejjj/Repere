<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de promotions | Simulateur</title><meta name="description" content="Comparez une réduction et calculez le prix final."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">ACHATS</div><h1 id="title">Calculateur de promotions</h1><p id="intro">Comparez une réduction et calculez le prix final.</p><div id="fields"><div class="field"><label for="p">Prix initial (€)</label><input id="p" type="number" step="any" value="100"></div><div class="field"><label for="r">Réduction (%)</label><input id="r" type="number" step="any" value="20"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Comparez une réduction et calculez le prix final.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"ACHATS",title:"Calculateur de promotions",intro:"Comparez une réduction et calculez le prix final.",fields:function(){},calc:function(){const p=+this.$("p").value,r=+this.$("r").value;if(p<0||r<0||r>100)return"Valeurs invalides.";const d=p*r/100;return"<strong>Prix final : "+this.euro(p-d)+"</strong><br><br>Économie : "+this.euro(d)},source:"Comparez une réduction et calculez le prix final.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
