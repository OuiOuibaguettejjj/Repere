mulateur prêt immobilier 2026",intro:"Calculez mensualité, intérêts, assurance et coût total d'un prêt à taux fixe.",fields:function(){return F.row([F.text("capital","Montant emprunté (€)","200000"),F.text("taux","Taux annuel hors assurance (%)","3.5"),F.text("duree","Durée (années)","20"),F.text("ass","Assurance annuelle (% du capital initial)","0.25")])},calc:function(){const c=+this.$('capital').value||0,r=(+this.$('taux').value||0)/1200,n=Math.round((+this.$('duree').value||0)*12),a=(+this.$('ass').value||0)/100;if(c<=0||n<=0||r<0||a<0)return 'Renseignez des valeurs valides.';const m=r?c*r/(1-Math.pow(1+r,-n)):c/n,ma=c*a/12,inter=m*n-c,ca=c*a*n/12;return '<strong>'+this.euro(m+ma)+' / mois avec assurance</strong><br><br>Mensualité hors assurance : '+this.euro(m)+'<br>Assurance estimée : '+this.euro(ma)+'/mois<br>Intérêts : '+this.euro(inter)+'<br>Coût assurance : '+this.euro(ca)+'<br>Coût total : '+this.euro(inter+ca)+' hors capital<p class="small">L’assurance est modélisée sur le capital initial ; un contrat réel peut utiliser une autre assiette.</p>'},source:"Formule d’annuité à taux fixe. Le coût réel inclut notamment intérêts, assurance, garantie, frais de dossier et courtage. Le TAEG est la référence pour comparer des offres réelles."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
