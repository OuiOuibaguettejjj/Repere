<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de moyenne | Simulateur</title><meta name="description" content="Calculez la moyenne arithmétique d'une série de nombres."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">STATISTIQUES</div><h1 id="title">Calculateur de moyenne</h1><p id="intro">Calculez la moyenne arithmétique d'une série de nombres.</p><div id="fields"><div class="field"><label for="s">Série de nombres</label><input id="s" value="12, 15, 18, 20"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez la moyenne arithmétique d'une série de nombres.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"STATISTIQUES",title:"Calculateur de moyenne",intro:"Calculez la moyenne arithmétique d'une série de nombres.",fields:function(){},calc:function(){const a=this.$("s").value.split(/[,;\s]+/).map(Number).filter(Number.isFinite);if(!a.length)return"Saisissez une série.";return"<strong>"+(a.reduce((x,y)=>x+y,0)/a.length).toLocaleString("fr-FR")+"</strong><br><br>"+a.length+" valeur(s)."},source:"Calculez la moyenne arithmétique d'une série de nombres.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
