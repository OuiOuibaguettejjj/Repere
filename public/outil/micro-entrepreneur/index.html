<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulateur micro-entrepreneur 2026 | Simulateur</title><meta name="description" content="Calculez les cotisations sociales du micro-entrepreneur selon votre activité et votre chiffre d'affaires."><link rel="canonical" href="https://simulateur.site/outil/micro-entrepreneur/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Simulateur micro-entrepreneur 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"ENTREPRENEURIAT",title:"Simulateur micro-entrepreneur 2026",intro:"Calculez les cotisations sociales du micro-entrepreneur selon votre activité et votre chiffre d'affaires.",fields:function(){return F.row([F.text("ca","Chiffre d'affaires encaissé (€)","40000"),F.select("act","Activité",[["vente","Vente de marchandises / hébergement"],["bic","Prestations de services BIC"],["bnc","Profession libérale non réglementée"],["cipav","Profession libérale relevant de la Cipav"]])])+F.select("acre","ACRE en cours",[["non","Non"],["oui","Oui"]])},calc:function(){const ca=+this.$("ca").value||0,a=this.$("act").value,acre=this.$("acre").value==="oui";const r={vente:.123,bic:.212,bnc:.256,cipav:.232}[a];let cot=ca*r;if(acre)cot*=.75;return "<strong>Chiffre d’affaires restant après cotisations : "+this.euro(Math.max(0,ca-cot))+"</strong><br><br>Taux de référence : "+(r*100).toFixed(1)+" %<br>Cotisations estimées : "+this.euro(cot)+"<p class=\'small\'>L’ACRE n’est pas une simple réduction universelle dans toutes les situations : le calcul ci-dessus applique une hypothèse de 25 % de réduction sur le taux sélectionné. L’impôt sur le revenu et la CFP ne sont pas inclus.</p>"},source:"Urssaf / Service-Public Entreprendre : en 2026, taux micro-social de 12,3 % pour vente/hébergement, 21,2 % pour prestations BIC, 25,6 % pour professions libérales non réglementées et 23,2 % pour professions relevant de la Cipav."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
