ns et revenu restant.",fields:function(){return F.row([F.text("ca","Chiffre d’affaires annuel (€)","40000"),F.select("act","Activité",[["vente","Vente"],["bic","Prestations BIC"],["bnc","BNC"]])])},calc:function(){let r={vente:.123,bic:.212,bnc:.254}[this.$("act").value],c=Number(this.$("ca").value)*r;return"<strong>"+this.euro(Number(this.$("ca").value)-c)+"</strong> après cotisations estimées<br>Cotisations : "+this.euro(c)},source:"Urssaf Mon-entreprise. Les taux dépendent de l’activité, de l’ACRE et d’autres paramètres."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
