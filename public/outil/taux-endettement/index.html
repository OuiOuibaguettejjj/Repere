<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Calculateur taux d'endettement 2026 | Simulateur</title><link rel="canonical" href="https://simulateur.site/outil/taux-endettement/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><script>const F={text:(i,l,p="")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="0.01" placeholder="'+p+'"></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"IMMOBILIER",title:"Calculateur de taux d'endettement",intro:"Mesurez votre taux d'endettement à partir de vos revenus et charges mensuelles.",fields:function(){return F.row([F.text("revenus","Revenus mensuels nets avant impôt (€)","4000"),F.text("credits","Crédits existants, assurance comprise (€ / mois)","400"),F.text("loyer","Loyer restant à payer (€ / mois)","0"),F.text("nouveau","Nouvelle mensualité de crédit, assurance comprise (€ / mois)","800")])},calc:function(){const r=+this.$("revenus").value||0,c=+this.$("credits").value||0,l=+this.$("loyer").value||0,n=+this.$("nouveau").value||0;if(r<=0||c<0||l<0||n<0)return"Renseignez des montants valides.";const ratio=(c+l+n)/r*100;return"<strong>"+this.num(ratio)+" %</strong> de taux d'endettement<br><small>Charges retenues : "+this.euro(c+l+n)+" / mois.</small><br><br>Le seuil de 35 % est un repère HCSF, pas une garantie d'accord ou de refus."},source:"Le HCSF fixe en principe un taux d'effort maximal de 35 % pour les crédits immobiliers. Cette simulation utilise les montants saisis et ne reproduit pas l'analyse complète d'une banque."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
