 base, trois salaires / 91,25, plafond de salaire pris en compte de 2 613,82 € par mois en 2026 et IJ maximale de 42,97 € bruts. Délai de carence de 3 jours en principe. Les conventions collectives peuvent prévoir un maintien plus favorable."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script><script src="/enter-calcul.js" defer></script></body></html>
