<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de moyenne pondérée | Simulateur</title><meta name="description" content="Calculez une moyenne pondérée à partir de valeurs et de leurs coefficients."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">STATISTIQUES</div><h1 id="title">Calculateur de moyenne pondérée</h1><p id="intro">Calculez une moyenne pondérée à partir de valeurs et de leurs coefficients.</p><div id="fields"><div class="field"><label for="v1">Valeur 1</label><input id="v1" type="number" step="any" value="12"></div><div class="field"><label for="w1">Poids 1</label><input id="w1" type="number" step="any" value="2"></div><div class="field"><label for="v2">Valeur 2</label><input id="v2" type="number" step="any" value="16"></div><div class="field"><label for="w2">Poids 2</label><input id="w2" type="number" step="any" value="1"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez une moyenne pondérée à partir de valeurs et de leurs coefficients.. Calcul selon les formules mathématiques standard.</p></div></div></div></main><script>window.TOOL={ey:"STATISTIQUES",title:"Calculateur de moyenne pondérée",intro:"Calculez une moyenne pondérée à partir de valeurs et de leurs coefficients.",fields:function(){},calc:function(){const a=+this.$("v1").value,b=+this.$("w1").value,c=+this.$("v2").value,d=+this.$("w2").value;if(b+d===0)return"Poids invalides.";return"<strong>"+((a*b+c*d)/(b+d)).toLocaleString("fr-FR")+"</strong>"},source:"Calculez une moyenne pondérée à partir de valeurs et de leurs coefficients.. Calcul selon les formules mathématiques standard."};window.ad
