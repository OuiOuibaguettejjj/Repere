<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur capacité d’emprunt immobilier 2026 | Simulateur</title><meta name="description" content="Estimez votre capacité d’emprunt immobilier selon vos revenus, charges, taux et durée."><link rel="canonical" href="https://simulateur.site/outil/capacite-emprunt/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">IMMOBILIER</div><h1 id="title">Calculateur de capacité d’emprunt immobilier</h1><p class="tool-intro" id="intro">Estimez la mensualité maximale et le capital empruntable.</p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos valeurs puis lancez le calcul.</div><div class="formula"><strong>Source et périmètre</strong><p id="source"></p></div></div></div></main><script>const F={t:(i,l,p,s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>'};window.TOOL={ey:"IMMOBILIER",title:"Calculateur de capacité d’emprunt immobilier",intro:"Estimez la mensualité maximale et le capital empruntable.",fields:()=>F.t("revenus","Revenus mensuels nets avant impôt (€)","3500")+F.t("charges","Crédits et charges mensuels (€)","0")+F.t("taux","Taux annuel (%)","3.2",".01")+F.t("duree","Durée (années)","25","1"),calc:function(){let r=+this.$("revenus").value,c=+this.$("charges").value,t=+this.$("taux").value/1200,n=+this.$("duree").value*12,m=r*.35-c;if(r<=0||c<0||t<0||n<=0)return"Valeurs invalides.";if(m<=0)return"<strong>0 €</strong> de mensualité disponible selon les données saisies.";let k=t?m*(1-Math.pow(1+t,-n))/t:m*n;return"<strong>"+this.euro(k)+"</strong> de capital empruntable estimé<br><small>Mensualité maximale : "+this.euro(m)+" · taux : "+this.num(t*1200)+" % · durée : "+n/12+" ans.</small>"},source:"Économie.gouv.fr : le taux d’effort ne doit en principe pas dépasser 35 % des revenus et inclut les charges d’emprunt, assurance comprise. Cette estimation ne garantit pas un accord bancaire et ne traite pas les critères propres à chaque établissement."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script><script src="/enter-calcul.js" defer></script></body></html>
