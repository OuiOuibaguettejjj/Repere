<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur indemnité de précarité CDD 2026 | Simulateur</title><meta name="description" content="Estimez l'indemnité de fin de contrat d'un CDD ou d'une mission d'intérim."><link rel="canonical" href="https://simulateur.site/outil/indemnite-precarite/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><script>const F={text:(i,l,p="")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="0.01" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"TRAVAIL",title:"Calculateur d'indemnité de précarité",intro:"Estimez la prime de fin de CDD ou de mission d'intérim.",fields:function(){return F.row([F.select("contrat","Contrat",[["cdd","CDD"],["interim","Intérim"]]),F.text("rem","Rémunération brute totale versée (€)","20000"),F.select("taux","Taux",[["10","10 % — cas général"],["6","6 % — si les conditions conventionnelles sont remplies"],["0","0 % — indemnité non due"]])])},calc:function(){const r=+this.$("rem").value||0,t=+this.$("taux").value||0;if(r<0)return"Renseignez une rémunération valide.";return"<strong>"+this.euro(r*t/100)+"</strong> d'indemnité estimée<br><small>Base : "+this.euro(r)+" × "+this.num(t)+" %</small>"},source:"Service-Public propose un simulateur pour les CDD et l'intérim. Le cas général est de 10 % de la rémunération brute totale ; un taux de 6 % peut être prévu par convention collective dans les conditions légales. Plusieurs exceptions existent."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
