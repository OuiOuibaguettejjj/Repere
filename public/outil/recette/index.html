<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de recette | Simulateur</title><meta name="description" content="Adaptez automatiquement les quantités d'une recette au nombre de personnes."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">CUISINE</div><h1 id="title">Calculateur de recette</h1><p id="intro">Adaptez automatiquement les quantités d'une recette au nombre de personnes.</p><div id="fields"><div class="field"><label for="p">Personnes prévues</label><input id="p" type="number" step="any" value="4"></div><div class="field"><label for="q">Personnes souhaitées</label><input id="q" type="number" step="any" value="6"></div><div class="field"><label for="x">Quantité d'ingrédient</label><input id="x" type="number" step="any" value="500"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Adaptez automatiquement les quantités d'une recette au nombre de personnes.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"CUISINE",title:"Calculateur de recette",intro:"Adaptez automatiquement les quantités d'une recette au nombre de personnes.",fields:function(){},calc:function(){const p=+this.$("p").value,q=+this.$("q").value,x=+this.$("x").value;if(p<=0||q<=0||x<0)return"Valeurs invalides.";return"<strong>"+(x*q/p).toLocaleString("fr-FR",{maximumFractionDigits:2})+"</strong> unités de l'ingrédient saisi<br><br>Coefficient : "+(q/p).toFixed(2)},source:"Adaptez automatiquement les quantités d'une recette au nombre de personnes.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
