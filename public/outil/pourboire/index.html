<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de pourboire | Simulateur</title><meta name="description" content="Calculez le pourboire et le montant total d'une addition."><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">VIE QUOTIDIENNE</div><h1 id="title">Calculateur de pourboire</h1><p id="intro">Calculez le pourboire et le montant total d'une addition.</p><div id="fields"><div class="field"><label for="a">Addition (€)</label><input id="a" type="number" step="any" value="50"></div><div class="field"><label for="p">Pourboire (%)</label><input id="p" type="number" step="any" value="10"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calculez le pourboire et le montant total d'une addition.. Formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"VIE QUOTIDIENNE",title:"Calculateur de pourboire",intro:"Calculez le pourboire et le montant total d'une addition.",fields:function(){},calc:function(){const a=+this.$("a").value,p=+this.$("p").value;if(a<0||p<0)return"Valeurs invalides.";const t=a*p/100;return"<strong>Pourboire : "+this.euro(t)+"</strong><br><br>Total : "+this.euro(a+t)},source:"Calculez le pourboire et le montant total d'une addition.. Formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
