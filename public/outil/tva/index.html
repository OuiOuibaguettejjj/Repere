<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur TVA HT/TTC — taux et montant de TVA | Simulateur</title><meta name="description" content="Calculez HT, TTC et le montant de TVA. Passez du HT au TTC ou du TTC au HT avec le taux de TVA choisi."><link rel="canonical" href="https://simulateur.site/outil/tva/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · TVA</div><div class="tool"><h1>Calculateur de TVA</h1><p class="tool-intro">Calculez le montant de TVA et passez du HT au TTC ou du TTC au HT.</p><div class="field"><label for="mode">Sens du calcul</label><select id="mode"><option value="ht">HT → TTC</option><option value="ttc">TTC → HT</option></select></div><div class="row"><div class="field"><label for="price">Montant (€)</label><input id="price" type="number" step="any" placeholder="100"></div><div class="field"><label for="rate">Taux de TVA (%)</label><input id="rate" type="number" step="any" value="20"></div></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">Saisissez vos valeurs.</div><div class="formula"><strong>Rappel</strong><p>HT → TTC : HT × (1 + taux ÷ 100). TTC → HT : TTC ÷ (1 + taux ÷ 100).</p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a></div></div></footer><script>const price=document.querySelector('#price'),rate=document.querySelector('#rate'),mode=document.querySelector('#mode'),r=document.querySelector('#r');function fmt(x){return x.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2})}function calc(){const p=Number(price.value),t=Number(rate.value);if(!Number.isFinite(p)||!Number.isFinite(t)||t<=-100){r.textContent='Saisissez des valeurs valides.';return}if(mode.value==='ht'){const vat=p*t/100,ttc=p+vat;r.innerHTML='<strong>'+fmt(ttc)+'</strong><br>TVA : '+fmt(vat)+' · HT : '+fmt(p)}else{const ht=p/(1+t/100),vat=p-ht;r.innerHTML='<strong>'+fmt(ht)+'</strong><br>TVA : '+fmt(vat)+' · TTC : '+fmt(p)}}</script><script src="/enter-calcul.js" defer></script></body></html>
