<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculatrice en ligne | Simulateur</title><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Calculatrice en ligne</h1><p id="intro">Effectuez les opérations courantes rapidement.</p><div id="fields"><div class="row"><div class="field"><label for="a">Nombre A</label><input id="a" type="number" step="any" value="10"></div><div class="field"><label for="b">Nombre B</label><input id="b" type="number" step="any" value="5"></div></div><div class="field"><label for="op">Opération</label><select id="op"><option>+</option><option>-</option><option>×</option><option>÷</option></select></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><strong>Méthode</strong><p id="source">Calcul arithmétique direct. La division par zéro est refusée.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Calculatrice en ligne",intro:"Effectuez les opérations courantes rapidement.",fields:function(){},calc:function(){const a=Number(this.$("a").value),b=Number(this.$("b").value),o=this.$("op").value;if(!Number.isFinite(a)||!Number.isFinite(b)||(o==="÷"&&b===0))return"Valeurs invalides.";const r=o==="+"?a+b:o==="-"?a-b:o==="×"?a*b:a/b;return"<strong>"+r.toLocaleString("fr-FR")+"</strong>"},source:"Calcul arithmétique direct."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
