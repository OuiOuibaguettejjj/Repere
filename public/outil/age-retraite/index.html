<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur âge retraite 2026 | Âge légal et trimestres</title><meta name="description" content="Trouvez l’âge légal de départ à la retraite et le nombre de trimestres requis selon votre année de naissance."><link rel="canonical" href="https://simulateur.site/outil/age-retraite/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow">RETRAITE</div><h1 id="title">Calculateur âge de départ à la retraite 2026</h1><p class="tool-intro" id="intro">Trouvez votre âge légal et le nombre de trimestres requis.</p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez votre année de naissance.</div><div class="formula"><strong>Source et périmètre</strong><p id="source"></p></div></div></div></main><script>window.TOOL={ey:"RETRAITE",title:"Calculateur âge de départ à la retraite 2026",intro:"Trouvez votre âge légal et le nombre de trimestres requis.",fields:()=>'<div class="field"><label for="naissance">Année de naissance</label><input id="naissance" type="number" min="1958" max="2100" step="1" placeholder="1990"></div>',calc:function(){let y=+this.$("naissance").value;if(y<1958||y>2100)return"Année non prise en charge.";let a,q;if(y<=1960){a="62 ans";q=167}else if(y===1961){a="62 ans et 3 mois";q=168}else if(y===1962){a="62 ans et 6 mois";q=169}else if(y===1963){a="62 ans et 9 mois";q=170}else if(y===1964){a="63 ans";q=171}else if(y===1965){a="63 ans et 3 mois";q=172}else if(y===1966){a="63 ans et 6 mois";q=172}else if(y===1967){a="63 ans et 9 mois";q=172}else{a="64 ans";q=172}return"<strong>Âge légal : "+a+"</strong><br><small>"+q+" trimestres sont requis pour le taux plein avant 67 ans. À 67 ans, le taux plein est automatique, mais le montant dépend toujours de la durée d’assurance.</small>"},source:"Service-Public : l’âge légal varie de 62 à 64 ans selon la génération. Pour les personnes nées à partir de 1968, il est de 64 ans et 172 trimestres pour le taux plein avant 67 ans. Les carrières longues et autres départs anticipés ne sont pas calculés ici."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script><script src="/enter-calcul.js" defer></script></body></html>
