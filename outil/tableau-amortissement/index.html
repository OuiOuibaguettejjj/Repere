<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tableau d’amortissement de prêt | Simulateur</title><meta name="description" content="Visualisez capital et intérêts mois par mois."><link rel="canonical" href="https://simulateur.site/outil/tableau-amortissement/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Tableau d’amortissement de prêt</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title">Tableau d’amortissement de prêt</h1><p class="tool-intro" id="intro">Visualisez capital et intérêts mois par mois.</p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos valeurs puis lancez le calcul.</div><div class="formula"><strong>Source et périmètre</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"IMMOBILIER",title:"Tableau d’amortissement de prêt",intro:"Visualisez capital et intérêts mois par mois.",fields:function(){return F.row([F.text("capital","Capital (€)","200000"),F.text("taux","Taux annuel (%)","3.5")])+F.row([F.text("duree","Durée (années)","20"),F.text("mois","Lignes","12","1")])},calc:function(){let c=Number(this.$("capital")?.value||0),t=Number(this.$("taux")?.value||0)/1200,N=Number(this.$("duree")?.value||0)*12,S=Math.min(60,Math.max(1,Number(this.$("mois")?.value||0))),m=t?c*t/(1-Math.pow(1+t,-N)):c/N,b=c,h="<table style=\"width:100%;border-collapse:collapse\"><tr><th>Mois</th><th>Mensualité</th><th>Intérêts</th><th>Capital</th><th>Restant</th></tr>";for(let i=1;i<=S;i++){let it=b*t,ca=m-it;b-=ca;h+="<tr><td>"+i+"</td><td>"+this.euro(m)+"</td><td>"+this.euro(it)+"</td><td>"+this.euro(ca)+"</td><td>"+this.euro(Math.max(0,b))+"</td></tr>"}return h+"</table>"},source:"Formule d’amortissement à taux fixe, hors assurance et frais."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
