<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcul du salaire horaire — outil gratuit | Repere</title><meta name="description" content="Estimez votre salaire horaire à partir de votre salaire mensuel et de votre durée de travail."><link rel="canonical" href="https://repere.pasvpasv5.workers.dev/outil/salaire-horaire/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere</a><nav class="navlinks"><a href="/">Outils</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><a class="back" href="/">← Tous les outils</a><div class="tool"><h1>Salaire horaire</h1><p class="muted">Estimez le taux horaire à partir du salaire mensuel et du nombre d'heures travaillées.</p><div class="field"><label for="salary">Salaire mensuel (€)</label><input id="salary" type="number" step="any" placeholder="2500"></div><div class="field"><label for="hours">Heures travaillées par mois</label><input id="hours" type="number" step="any" value="151.67"></div><button class="btn" onclick="calc()">Calculer</button><div class="result" id="r">—</div></div></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){const s=+salary.value,h=+hours.value;if(!Number.isFinite(s)||!Number.isFinite(h)||h<=0)return r.textContent='Saisissez des valeurs valides.';r.textContent=(s/h).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2})+' / heure'}</script></body></html>
