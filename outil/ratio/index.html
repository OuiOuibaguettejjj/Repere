<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de ratio — proportion entre deux valeurs | Repere</title><meta name="description" content="Calculez un ratio entre deux valeurs et simplifiez-le."><link rel="canonical" href="https://repere.repere.workers.dev/outil/ratio/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="tool"><h1>Ratio</h1><p class="tool-intro">Comparez deux quantités sous la forme A:B et obtenez leur proportion.</p><div class="row"><div class="field"><label for="a">A</label><input id="a" type="number" step="any" placeholder="2"></div><div class="field"><label for="b">B</label><input id="b" type="number" step="any" placeholder="3"></div></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">—</div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>function calc(){const a=Number(document.querySelector('#a').value),b=Number(document.querySelector('#b').value),r=document.querySelector('#r');if(!Number.isFinite(a)||!Number.isFinite(b)||b===0){r.textContent='Saisissez deux valeurs valides.';return}const g=(x,y)=>y?g(y,x%y):Math.abs(x);const d=g(a,b);r.innerHTML='<strong>'+a+':'+b+'</strong><br>Ratio simplifié : '+(a/d)+':'+(b/d)+' · A/B = '+(a/b).toLocaleString('fr-FR',{maximumFractionDigits:4})}</script></body></html>
