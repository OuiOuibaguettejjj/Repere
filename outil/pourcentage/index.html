<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcul de pourcentage — outil gratuit | Repere</title><meta name="description" content="Calculez facilement un pourcentage d'une valeur et déterminez la proportion entre deux nombres."><link rel="canonical" href="https://repere.pages.dev/outil/pourcentage/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere</a><nav class="navlinks"><a href="/">Outils</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><a class="back" href="/">← Tous les outils</a><div class="tool"><h1>Calcul de pourcentage</h1><p class="muted">Calculez combien représente un pourcentage d'une valeur.</p><div class="field"><label for="p">Pourcentage (%)</label><input id="p" type="number" step="any" placeholder="20"></div><div class="field"><label for="v">Valeur</label><input id="v" type="number" step="any" placeholder="150"></div><button class="btn" onclick="calc()">Calculer</button><div class="result" id="r">—</div></div></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){const p=+document.querySelector('#p').value,v=+document.querySelector('#v').value;if(!Number.isFinite(p)||!Number.isFinite(v))return r.textContent='Saisissez deux nombres.';r.textContent=(p*v/100).toLocaleString('fr-FR',{maximumFractionDigits:2})}</script></body></html>
