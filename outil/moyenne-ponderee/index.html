<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de moyenne pondérée | Repere</title><meta name="description" content="Calculez une moyenne pondérée à partir de notes et de coefficients."><link rel="canonical" href="https://repere.repere.workers.dev/outil/moyenne-ponderee/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Moyenne pondérée</div><div class="tool"><h1>Moyenne pondérée</h1><p class="tool-intro">Entrez les valeurs et leurs coefficients, dans le même ordre.</p><div class="field"><label for="v">Valeurs</label><input id="v" placeholder="12, 15, 18"></div><div class="field"><label for="c">Coefficients</label><input id="c" placeholder="1, 2, 3"></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">—</div><div class="formula"><strong>Formule</strong><p>Σ(valeur × coefficient) ÷ Σ(coefficients).</p></div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>function nums(id){return document.querySelector(id).value.split(',').map(x=>Number(x.trim()))}function calc(){const v=nums('#v'),c=nums('#c'),r=document.querySelector('#r');if(!v.length||v.length!==c.length||v.some(x=>!Number.isFinite(x))||c.some(x=>!Number.isFinite(x)||x<0)||c.reduce((a,b)=>a+b,0)<=0){r.textContent='Vérifiez que les listes ont la même longueur et que les coefficients sont valides.';return}const total=c.reduce((s,x)=>s+x,0),m=v.reduce((s,x,i)=>s+x*c[i],0)/total;r.innerHTML='<strong>'+m.toLocaleString('fr-FR',{maximumFractionDigits:4})+'</strong><br>Coefficient total : '+total.toLocaleString('fr-FR',{maximumFractionDigits:4})}</script></body></html>
