<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de moyenne — moyenne arithmétique | Repere</title><meta name="description" content="Calculez une moyenne arithmétique à partir de plusieurs valeurs."><link rel="canonical" href="https://repere.repere.workers.dev/outil/moyenne/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Moyenne</div><div class="tool"><h1>Moyenne</h1><p class="tool-intro">Entrez plusieurs nombres séparés par des virgules.</p><div class="field"><label for="values">Valeurs</label><input id="values" placeholder="12, 15, 18, 14"></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">—</div><div class="formula"><strong>Formule</strong><p>Somme des valeurs ÷ nombre de valeurs.</p></div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>function calc(){const raw=document.querySelector('#values').value.split(',').map(x=>x.trim());const a=raw.map(Number);const r=document.querySelector('#r');if(!a.length||a.some(x=>!Number.isFinite(x))){r.textContent='Utilisez uniquement des nombres séparés par des virgules.';return}const s=a.reduce((x,y)=>x+y,0)/a.length;r.innerHTML='<strong>'+s.toLocaleString('fr-FR',{maximumFractionDigits:4})+'</strong><br>'+a.length+' valeur(s)'}</script></body></html>
