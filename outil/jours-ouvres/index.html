<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de jours ouvrés — Simulateur</title><meta name="description" content="Comptez les jours ouvrés entre deux dates en excluant les samedis et dimanches."><link rel="canonical" href="https://simulateur.site/outil/jours-ouvres/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/temps/">Temps</a> · Jours ouvrés</div><div class="tool"><h1>Jours ouvrés entre deux dates</h1><p class="tool-intro">Comptez les jours du lundi au vendredi entre deux dates.</p><div class="fields"><div class="field"><label for="a">Date de début</label><input id="a" type="date"></div><div class="field"><label for="b">Date de fin</label><input id="b" type="date"></div></div><button class="button-main" id="calc">Calculer</button><div class="result" id="r">—</div><div class="formula"><strong>À savoir</strong><p>Les samedis et dimanches sont exclus. Les jours fériés français ne sont pas déduits dans cette version.</p></div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>const a=document.querySelector('#a'),b=document.querySelector('#b'),r=document.querySelector('#r');document.querySelector('#calc').addEventListener('click',()=>{if(!a.value||!b.value){r.textContent='Sélectionnez les deux dates.';return}const [ay,am,ad]=a.value.split('-').map(Number),[by,bm,bd]=b.value.split('-').map(Number),start=new Date(Date.UTC(ay,am-1,ad)),end=new Date(Date.UTC(by,bm-1,bd));if(start>end){r.textContent='La date de début doit être antérieure ou égale à la date de fin.';return}let n=0,d=new Date(start);while(d<=end){const w=d.getUTCDay();if(w!==0&&w!==6)n++;d.setUTCDate(d.getUTCDate()+1)}r.innerHTML='<strong>'+n.toLocaleString('fr-FR')+' jour'+(n>1?'s':'')+' ouvré'+(n>1?'s':'')+'</strong>'})</script></body></html>
