<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcul de proportion et règle de trois — Repere</title><meta name="description" content="Résolvez une proportion et une règle de trois simplement avec le calculateur Repere."><link rel="canonical" href="https://repere.repere.workers.dev/outil/proportion/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/">Accueil</a> → Proportion</div><section class="tool"><div class="eyebrow">CALCULATEUR</div><h1>Proportion et règle de trois</h1><p class="tool-intro">Si A correspond à B, trouvez la valeur correspondant à C.</p><div class="row"><div class="field"><label>A</label><input id="a" type="number" step="any" placeholder="5"></div><div class="field"><label>B</label><input id="b" type="number" step="any" placeholder="20"></div><div class="field"><label>C</label><input id="c" type="number" step="any" placeholder="8"></div></div><button class="button-main" onclick="calc()">Calculer D</button><div id="r" class="result" hidden></div><div class="formula"><strong>Formule</strong><p>D = B × C ÷ A.</p></div></section></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){let A=+a.value,B=+b.value,C=+c.value;r.hidden=false;r.innerHTML=A?'<strong>D = '+(B*C/A).toLocaleString('fr-FR',{maximumFractionDigits:8})+'</strong>':'A doit être différent de zéro.'}</script></body></html>
