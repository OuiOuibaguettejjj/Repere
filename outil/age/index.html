<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur d'âge — âge exact | Repere</title><meta name="description" content="Calculez votre âge en années, mois et jours à partir de votre date de naissance."><link rel="canonical" href="https://repere.repere.workers.dev/outil/age/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Âge</div><div class="tool"><h1>Âge</h1><p class="tool-intro">Calculez un âge en années, mois et jours à une date donnée.</p><div class="fields"><div class="field"><label for="b">Date de naissance</label><input id="b" type="date"></div><div class="field"><label for="d">Date de référence</label><input id="d" type="date"></div></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">—</div><div class="formula"><strong>Principe</strong><p>Le calcul tient compte du calendrier et des années bissextiles.</p></div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>const pad=n=>String(n).padStart(2,'0');const today=new Date();document.querySelector('#d').value=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());function calc(){const bs=document.querySelector('#b').value,ds=document.querySelector('#d').value,r=document.querySelector('#r');if(!bs||!ds){r.textContent='Sélectionnez les deux dates.';return}const [by,bm,bd]=bs.split('-').map(Number),[dy,dm,dd]=ds.split('-').map(Number),b=new Date(Date.UTC(by,bm-1,bd)),d=new Date(Date.UTC(dy,dm-1,dd));if(b>d){r.textContent='La date de naissance doit être antérieure à la date de référence.';return}let y=d.getFullYear()-b.getFullYear(),m=d.getMonth()-b.getMonth(),day=d.getDate()-b.getDate();if(day<0){m--;const daysPrev=new Date(d.getFullYear(),d.getMonth(),0).getDate();day+=daysPrev}if(m<0){y--;m+=12}r.innerHTML='<strong>'+y+' an'+(y>1?'s':'')+'</strong>, '+m+' mois et '+day+' jour'+(day>1?'s':'')}</script></body></html>
