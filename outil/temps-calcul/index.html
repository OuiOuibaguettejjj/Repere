<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Additionner des heures | Repere</title><meta name="description" content="Additionnez deux durées en heures et minutes."><link rel="canonical" href="https://repere.repere.workers.dev/outil/temps-calcul/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calcul de durée</div><div class="tool"><h1>Additionner des heures</h1><p class="tool-intro">Additionnez deux durées en heures et minutes.</p><div class="fields"><div class="field"><label for="h1">Première durée — heures</label><input id="h1" type="number" min="0" step="1" placeholder="2"></div><div class="field"><label for="m1">Minutes</label><input id="m1" type="number" min="0" step="1" placeholder="45"></div><div class="field"><label for="h2">Deuxième durée — heures</label><input id="h2" type="number" min="0" step="1" placeholder="1"></div><div class="field"><label for="m2">Minutes</label><input id="m2" type="number" min="0" step="1" placeholder="30"></div></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">—</div><div class="formula"><strong>À savoir</strong><p>Les minutes sont normalisées automatiquement : 60 minutes correspondent à 1 heure.</p></div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>function calc(){const v=['h1','m1','h2','m2'].map(x=>Number(document.querySelector('#'+x).value));const r=document.querySelector('#r');if(v.some(x=>!Number.isFinite(x)||x<0)){r.textContent='Saisissez des durées valides.';return}const t=v[0]*60+v[1]+v[2]*60+v[3];r.innerHTML='<strong>'+Math.floor(t/60)+' h '+(t%60)+' min</strong>'}</script></body></html>
