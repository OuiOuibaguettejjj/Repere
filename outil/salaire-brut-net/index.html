rtir du brut mensuel.",fields:function(){return F.row([F.text("brut","Salaire brut mensuel (€)","3000"),F.select("statut","Statut",[["noncadre","Non-cadre"],["cadre","Cadre"]])])},calc:function(){let b=Number(this.$("brut")?.value||0),r=this.$("statut").value==="cadre"?.25:.23;return"<strong>"+this.euro(b*(1-r))+"</strong> net estimé<br>Cotisations salariales estimées : "+this.euro(b*r)},source:"Urssaf Mon-entreprise / Service-Public. Les cotisations réelles dépendent de nombreux paramètres : estimation uniquement."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
