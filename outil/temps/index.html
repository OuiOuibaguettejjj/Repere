<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertisseur de temps — Simulateur</title><meta name="description" content="Convertissez une durée entre heures, minutes et secondes."><link rel="canonical" href="https://simulateur.site/outil/temps/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> → Temps</div><section class="tool"><div class="eyebrow">CONVERSION</div><h1>Convertisseur de temps</h1><p class="tool-intro">Convertissez une durée entre heures, minutes et secondes.</p><div class="field"><label for="h">Heures</label><input id="h" type="number" min="0" step="any"></div><div class="field"><label for="m">Minutes</label><input id="m" type="number" min="0" step="any"></div><div class="field"><label for="s">Secondes</label><input id="s" type="number" min="0" step="any"></div><button class="button-main" id="calc">Convertir</button><div id="r" class="result" hidden></div></section></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>const h=document.querySelector('#h'),m=document.querySelector('#m'),s=document.querySelector('#s'),r=document.querySelector('#r');document.querySelector('#calc').addEventListener('click',()=>{const H=Number(h.value||0),M=Number(m.value||0),S=Number(s.value||0);if(![H,M,S].every(Number.isFinite)||H<0||M<0||S<0){r.hidden=false;r.textContent='Saisissez des valeurs valides.';return}const T=H*3600+M*60+S;r.hidden=false;r.innerHTML='<strong>'+T.toLocaleString('fr-FR')+' secondes</strong><br>'+ (T/3600).toLocaleString('fr-FR',{maximumFractionDigits:6})+' heures · '+(T/60).toLocaleString('fr-FR',{maximumFractionDigits:6})+' minutes'})</script></body></html>
