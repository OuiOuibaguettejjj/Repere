<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertisseur de temps — Simulateur</title><meta name="description" content="Convertissez heures, minutes et secondes avec Simulateur."><link rel="canonical" href="https://simulateur.site/outil/temps/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/">Accueil</a> → Temps</div><section class="tool"><div class="eyebrow">CONVERSION</div><h1>Convertisseur de temps</h1><p class="tool-intro">Convertissez une durée entre heures, minutes et secondes.</p><div class="field"><label>Heures</label><input id="h" type="number" min="0" step="any"></div><div class="field"><label>Minutes</label><input id="m" type="number" min="0" step="any"></div><div class="field"><label>Secondes</label><input id="s" type="number" min="0" step="any"></div><button class="button-main" onclick="calc()">Convertir</button><div id="r" class="result" hidden></div></section></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){let H=+h.value||0,M=+m.value||0,S=+s.value||0,T=H*3600+M*60+S;r.hidden=false;r.innerHTML='<strong>'+T.toLocaleString('fr-FR')+' secondes</strong><br>'+ (T/3600).toLocaleString('fr-FR',{maximumFractionDigits:6})+' heures · '+(T/60).toLocaleString('fr-FR',{maximumFractionDigits:6})+' minutes'}</script></body></html>
