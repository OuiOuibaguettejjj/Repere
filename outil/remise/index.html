<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcul de remise — prix après réduction | Repere</title><meta name="description" content="Calculez le prix final après une remise en pourcentage."><link rel="canonical" href="https://repere.pasvpasv5.workers.dev/outil/remise/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere</a><nav class="navlinks"><a href="/">Outils</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><a class="back" href="/">← Tous les outils</a><div class="tool"><h1>Calcul de remise</h1><p class="muted">Trouvez le prix après une réduction.</p><div class="field"><label for="price">Prix initial (€)</label><input id="price" type="number" step="any" placeholder="80"></div><div class="field"><label for="discount">Remise (%)</label><input id="discount" type="number" step="any" placeholder="25"></div><button class="btn" onclick="calc()">Calculer</button><div class="result" id="r">—</div></div></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){const p=+price.value,d=+discount.value;if(!Number.isFinite(p)||!Number.isFinite(d))return r.textContent='Saisissez des valeurs valides.';const saving=p*d/100;r.textContent='Prix final : '+(p-saving).toLocaleString('fr-FR',{maximumFractionDigits:2})+' € · Économie : '+saving.toLocaleString('fr-FR',{maximumFractionDigits:2})+' €'}</script></body></html>
