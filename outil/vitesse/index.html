<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de vitesse — distance et temps | Simulateur</title><meta name="description" content="Calculez une vitesse à partir d'une distance et d'un temps, en km/h ou m/s."><link rel="canonical" href="https://simulateur.site/outil/vitesse/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Vitesse</div><div class="tool"><h1>Vitesse</h1><p class="tool-intro">Trouvez la vitesse moyenne à partir d'une distance et d'un temps.</p><div class="fields"><div class="field"><label for="d">Distance (km)</label><input id="d" type="number" min="0" step="any" placeholder="120"></div><div class="field"><label for="t">Temps (heures)</label><input id="t" type="number" min="0" step="any" placeholder="1.5"></div></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">—</div><div class="formula"><strong>Formule</strong><p>Vitesse = distance ÷ temps. Le résultat est une vitesse moyenne.</p></div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>function calc(){const d=Number(document.querySelector('#d').value),t=Number(document.querySelector('#t').value),r=document.querySelector('#r');if(!Number.isFinite(d)||!Number.isFinite(t)||d<0||t<=0){r.textContent='Saisissez une distance positive et un temps supérieur à zéro.';return}const kmh=d/t;r.innerHTML='<strong>'+kmh.toLocaleString('fr-FR',{maximumFractionDigits:3})+' km/h</strong><br>'+((kmh/3.6)).toLocaleString('fr-FR',{maximumFractionDigits:3})+' m/s'}</script></body></html>
