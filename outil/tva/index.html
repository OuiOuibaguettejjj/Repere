<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcul de TVA HT/TTC — outil gratuit | Repere</title><meta name="description" content="Calculez un prix TTC à partir du HT et du taux de TVA, avec le montant de TVA."><link rel="canonical" href="https://repere.repere.workers.dev/outil/tva/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere</a><nav class="navlinks"><a href="/">Outils</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><a class="back" href="/">← Tous les outils</a><div class="tool"><h1>Calcul de TVA</h1><p class="muted">Calculez le montant de TVA et le prix TTC à partir d'un prix HT.</p><div class="field"><label for="ht">Prix HT (€)</label><input id="ht" type="number" step="any" placeholder="100"></div><div class="field"><label for="rate">Taux de TVA (%)</label><input id="rate" type="number" step="any" value="20"></div><button class="btn" onclick="calc()">Calculer</button><div class="result" id="r">—</div></div></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){const h=+ht.value,t=+rate.value;if(!Number.isFinite(h)||!Number.isFinite(t))return r.textContent='Saisissez des valeurs valides.';const x=h*t/100;r.textContent='TVA : '+x.toLocaleString('fr-FR',{maximumFractionDigits:2})+' € · TTC : '+(h+x).toLocaleString('fr-FR',{maximumFractionDigits:2})+' €'}</script></body></html>
