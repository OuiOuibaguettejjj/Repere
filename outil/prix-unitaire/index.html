<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de prix unitaire — prix au kilo, litre ou unité | Simulateur</title><meta name="description" content="Calculez le prix au kilo, au litre ou à l'unité pour comparer facilement des produits de formats différents."><link rel="canonical" href="https://simulateur.site/outil/prix-unitaire/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/comparateurs/">Comparateurs</a> · Prix unitaire</div><div class="tool"><h1>Prix unitaire</h1><p class="tool-intro">Ramenez un prix à une base commune pour comparer deux formats.</p><div class="row"><div class="field"><label for="price">Prix (€)</label><input id="price" type="number" step="any" placeholder="4.50"></div><div class="field"><label for="qty">Quantité</label><input id="qty" type="number" step="any" placeholder="750"></div></div><div class="field"><label for="unit">Unité de quantité</label><select id="unit"><option value="g">grammes → prix au kg</option><option value="ml">millilitres → prix au L</option><option value="u">unités → prix par unité</option></select></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">Saisissez vos valeurs.</div><div class="formula"><strong>Exemple</strong><p>4,50 € pour 750 g = 6,00 € / kg.</p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a></div></div></footer><script>const price=document.querySelector('#price'),qty=document.querySelector('#qty'),unit=document.querySelector('#unit'),r=document.querySelector('#r');function calc(){const p=Number(price.value),q=Number(qty.value);if(!Number.isFinite(p)||!Number.isFinite(q)||q<=0){r.textContent='Saisissez des valeurs valides.';return}const x=unit.value==='u'?p/q:p/q*1000;r.innerHTML='<strong>'+x.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2})+'</strong> '+(unit.value==='u'?'/ unité':unit.value==='g'?'/ kg':'/ L')}</script></body></html>
