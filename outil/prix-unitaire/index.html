<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prix au kilo ou au litre — calculateur | Repere</title><meta name="description" content="Calculez le prix au kilo, au litre ou par unité pour comparer des produits."><link rel="canonical" href="https://repere.repere.workers.dev/outil/prix-unitaire/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere</a><nav class="navlinks"><a href="/">Outils</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><a class="back" href="/">← Tous les outils</a><div class="tool"><h1>Prix unitaire</h1><p class="muted">Calculez le prix pour 1 kg, 1 litre ou 1 unité.</p><div class="field"><label for="price">Prix (€)</label><input id="price" type="number" step="any" placeholder="4.50"></div><div class="field"><label for="qty">Quantité</label><input id="qty" type="number" step="any" placeholder="750"></div><div class="field"><label for="unit">Unité de quantité</label><select id="unit"><option value="g">grammes</option><option value="ml">millilitres</option><option value="u">unités</option></select></div><button class="btn" onclick="calc()">Calculer</button><div class="result" id="r">—</div></div></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){const p=+price.value,q=+qty.value,u=unit.value;if(!Number.isFinite(p)||!Number.isFinite(q)||q<=0)return r.textContent='Saisissez des valeurs valides.';const x=u==='u'?p/q:p/q*1000;r.textContent=(x).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2})+(u==='u'?' / unité':u==='g'?' / kg':' / L')}</script></body></html>
