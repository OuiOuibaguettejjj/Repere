<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de surface — m² | Simulateur</title><meta name="description" content="Calculez une surface en m² à partir de longueurs, dimensions ou de plusieurs rectangles."><link rel="canonical" href="https://simulateur.site/outil/surface/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Surface</div><div class="tool"><h1>Surface</h1><p class="tool-intro">Calculez rapidement la surface d'un rectangle ou d'une pièce.</p><div class="fields"><div class="field"><label for="l">Longueur (m)</label><input id="l" type="number" min="0" step="any" placeholder="5"></div><div class="field"><label for="w">Largeur (m)</label><input id="w" type="number" min="0" step="any" placeholder="3"></div></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">—</div><div class="formula"><strong>Formule</strong><p>Surface = longueur × largeur.</p></div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>function calc(){const l=Number(document.querySelector('#l').value),w=Number(document.querySelector('#w').value),r=document.querySelector('#r');if(!Number.isFinite(l)||!Number.isFinite(w)||l<0||w<0){r.textContent='Saisissez deux dimensions valides.';return}r.innerHTML='<strong>'+ (l*w).toLocaleString('fr-FR',{maximumFractionDigits:4}) +' m²</strong>'}</script></body></html>
