<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur coût au kilomètre — carburant | Repere</title><meta name="description" content="Calculez le coût de carburant par kilomètre et le coût d'un trajet."><link rel="canonical" href="https://repere.repere.workers.dev/outil/cout-km/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Repere<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="tool"><h1>Coût au kilomètre</h1><p class="tool-intro">Estimez le coût de carburant d'un trajet à partir de la consommation et du prix au litre.</p><div class="row"><div class="field"><label for="cons">Consommation (L/100 km)</label><input id="cons" type="number" step="any" placeholder="6"></div><div class="field"><label for="fuel">Prix du carburant (€/L)</label><input id="fuel" type="number" step="any" placeholder="1.80"></div></div><div class="field"><label for="dist">Distance du trajet (km)</label><input id="dist" type="number" step="any" placeholder="250"></div><button class="button-main" onclick="calc()">Calculer</button><div class="result" id="r">—</div></div></div></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>function calc(){const c=Number(cons.value),p=Number(fuel.value),d=Number(dist.value),r=document.querySelector('#r');if(![c,p,d].every(Number.isFinite)||c<0||p<0||d<0){r.textContent='Saisissez des valeurs valides.';return}const km=c*p/100,total=km*d;r.innerHTML='<strong>'+km.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:3})+' / km</strong><br>Trajet : '+total.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2})+' · carburant consommé : '+(c*d/100).toLocaleString('fr-FR',{maximumFractionDigits:2})+' L'}</script></body></html>
