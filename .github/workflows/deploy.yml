name: Deploy Simulateur to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static site
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'public';
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.isFile() && p.endsWith('.html')) files.push(p);
            }
          }
          walk(root);

          const errors = [];
          const canonicals = new Map();

          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            if (!/<title>[^<]+<\/title>/i.test(html)) errors.push(file + ': missing <title>');
            const canonical = html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i);
            if (!canonical) errors.push(file + ': missing canonical');
            else {
              if (canonicals.has(canonical[1])) errors.push(file + ': duplicate canonical ' + canonical[1] + ' (also ' + canonicals.get(canonical[1]) + ')');
              canonicals.set(canonical[1], file);
            }
          }

          if (errors.length) console.warn(errors.join('\n'));
          console.log(`Checked ${files.length} HTML pages; metadata issues are warnings for now.`);
          NODE

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
