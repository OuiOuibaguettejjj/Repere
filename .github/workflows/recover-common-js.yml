name: Recover shared calculator script

on:
  push:
    paths:
      - '.github/workflows/recover-common-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Recover simulateurs.js
        run: |
          node <<'NODE'
          const fs=require('fs');
          const url='https://89308f06-simulateur.repere.workers.dev/simulateurs.js';
          (async()=>{
            const r=await fetch(url);
            const s=await r.text();
            if(!r.ok) throw new Error('HTTP '+r.status);
            if(s.length<1000) throw new Error('Suspiciously small simulateurs.js: '+s.length);
            if(/TRUNCATED/i.test(s)) throw new Error('Truncated simulateurs.js');
            fs.writeFileSync('public/simulateurs.js',s,'utf8');
            console.log('Recovered simulateurs.js:',s.length,'bytes');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/simulateurs.js
          git commit -m "Recover shared calculator runtime"
          git push
