name: Recover site assets from known-good Worker version

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-site.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Recover HTML and CSS from known-good version
        env:
          BASE_URL: https://89308f06-simulateur.repere.workers.dev
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const path = require('path');

          const base = process.env.BASE_URL;
          const files = cp.execSync("git ls-files 'public/**/*.html' 'public/index.html'", {encoding:"utf8"})
            .trim().split("\n").filter(Boolean)
            .filter(p => p !== "public/contact/index.html");

          async function fetchOne(file) {
            const pathname = "/" + file.slice("public/".length);
            const url = new URL(pathname, base);
            if (pathname.endsWith("/index.html")) {
              url.pathname = pathname.replace(/index\\.html$/, "");
            }
            const res = await fetch(url, {redirect:"follow"});
            const body = await res.text();
            if (!res.ok) throw new Error(file + ": HTTP " + res.status);
            if (body.includes("--- TRUNCATED ---")) throw new Error(file + ": truncated response");
            if (!body.toLowerCase().includes("</html>")) throw new Error(file + ": incomplete HTML");
            if (file.startsWith("public/outil/") && body.length < 1000) {
              throw new Error(file + ": suspiciously small calculator page (" + body.length + " bytes)");
            }
            fs.writeFileSync(file, body, "utf8");
            return {file, bytes: body.length};
          }

          (async () => {
            const results = [];
            for (let i = 0; i < files.length; i += 8) {
              const batch = files.slice(i, i + 8);
              results.push(...await Promise.all(batch.map(fetchOne)));
            }
            console.log("Recovered", results.length, "files");
            console.log(results.sort((a,b)=>a.file.localeCompare(b.file)).map(x=>x.file+" "+x.bytes+" bytes").join("\n"));

            const cssUrl = new URL("/styles.css", base);
            const cssRes = await fetch(cssUrl);
            const css = await cssRes.text();
            if (!cssRes.ok || css.length < 1000) throw new Error("styles.css recovery failed");
            fs.writeFileSync("public/styles.css", css, "utf8");
            console.log("Recovered public/styles.css", css.length, "bytes");
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Validate recovered source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const files = cp.execSync("git ls-files 'public/**/*.html' 'public/index.html'", {encoding:"utf8"}).trim().split("\n").filter(Boolean);
          const errors = [];
          for (const file of files) {
            const s = fs.readFileSync(file, "utf8");
            if (s.includes("--- TRUNCATED ---")) errors.push(file + ": truncation marker");
            if (!/^<!doctype html>/i.test(s.trim())) errors.push(file + ": missing doctype");
            if (!/<html\\b[^>]*>/i.test(s) || !/<head\\b[^>]*>/i.test(s) || !/<body\\b[^>]*>/i.test(s) || !/<\\/html>/i.test(s)) {
              errors.push(file + ": malformed document");
            }
            if (file.startsWith("public/outil/") && s.length < 1000) errors.push(file + ": calculator page too small");
          }
          if (errors.length) { console.error(errors.join("\n")); process.exit(1); }
          console.log("Validated", files.length, "HTML files.");
          NODE

      - name: Commit recovered source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No recovery changes."
            exit 0
          fi
          git commit -m "Recover site pages from known-good Worker version"
          git push
